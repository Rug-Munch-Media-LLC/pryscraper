[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pry"
version = "3.0.0"
description = "Free web scraping + browser automation API — self-hosted, no API keys needed"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rug Munch Media LLC" }]
keywords = ["scraping", "crawler", "browser-automation", "mcp", "x402", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
license-files = ["LICENSE", "LICENSE-BSL-STEALTH"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "trafilatura>=2.0.0",
    "readability-lxml>=0.8.1",
    "lxml>=5.3.0",
    "httpx>=0.28.0",
    "markdownify>=0.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "playwright>=1.50.0",
    "redis>=5.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "tiktoken>=0.8.0",
    "pillow>=10.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "anyio>=4.0.0",
    "croniter>=2.0.0",
    "structlog>=24.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "cloudscraper>=1.2.0",
    "aiohttp-socks[aiohttp]>=0.8.0",
    "aiohttp>=3.9.0",
    "undetected-chromedriver>=3.5.0",
    "pyjwt>=2.8.0",
    "apify>=2.0.0",
    "playwright-stealth>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pre-commit>=4.0.0",
    "alembic>=1.14.0",
    "respx>=0.21.0",
    "commitizen>=3.12.0",
]

[project.scripts]
pry = "cli:main"

[tool.setuptools.packages.find]
include = ["pry*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "A", "C4", "SIM", "UP", "RUF", "BLE"]
ignore = ["E501", "N815", "B008", "A002", "RUF006"]

# BLE001 (blind except Exception) is enforced. Pre-existing sites are
# marked with `# noqa: BLE001`; new code must use specific exception
# types (e.g. httpx.HTTPError, json.JSONDecodeError, OSError).

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    ".git/",
    "__pycache__/",
]
warn_unused_ignores = false
# TODO: Pry was built without strict typing; re-enable incrementally.
# Tracking issue: re-enable mypy strict mode after router refactor.
disable_error_code = [
    "dict-item",
    "index",
    "attr-defined",
    "call-arg",
    "operator",
    "arg-type",
    "abstract",
    "union-attr",
    "assignment",
    "list-item",
    "func-returns-value",
    "return-value",
    "no-untyped-call",
    "no-untyped-def",
]

[[tool.mypy.overrides]]
module = [
    "trafilatura",
    "trafilatura.*",
    "readability",
    "readability.*",
    "playwright",
    "playwright.*",
    "pypdf",
    "pypdf.*",
    "docx",
    "docx.*",
    "PIL",
    "PIL.*",
    "markdownify",
    "markdownify.*",
    "pandas",
    "pandas.*",
    "yaml",
    "yaml.*",
    "numpy",
    "numpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Skip `integration` tests by default — they require live Postgres + Redis.
# Run them explicitly with: pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: tests that require live infrastructure (Postgres, Redis, external HTTP). Skipped by default; run with `pytest -m integration`.",
]

[tool.coverage.run]
branch = true
source = ["api", "cli", "extractor", "parser", "scraper", "monitor", "network", "cache", "auth", "errors", "paths", "settings", "db", "tasks", "quality", "reports", "extraction", "x402", "x402_middleware"]
omit = [
    "tests/*",
    "browser-extension/*",
    "shopify-app/*",
    "wordpress-plugin/*",
    "*/templates/*",
    "*/profiles/*",
    "*/stealth_scripts/*",
    "pry.egg-info/*",
    "build/*",
    "dist/*",
]

[tool.coverage.report]
fail_under = 45  # gradual path: current is ~47%; raise to 60, 70, 75, 80 in successive PRs
precision = 1
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
]
