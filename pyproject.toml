[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name. The PyPI project "pry" is already taken by an
# unrelated package (see README), so the publishable distribution is
# `pryscraper-mcp` while the importable package/modules keep their existing
# layout (pry_mcp package + top-level modules such as api, cli, scraper) and
# the local `pry` console-script name is preserved. This matches server.json
# (registryType: pypi, identifier: pryscraper-mcp) and the `uvx pryscraper-mcp`
# install flow used throughout README/SKILL.md/llms.txt.
name = "pryscraper-mcp"
version = "3.0.0"
description = "Free web scraping + browser automation API — self-hosted, no API keys needed"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rug Munch Media LLC" }]
keywords = [
    "scraping",
    "crawler",
    "browser-automation",
    "mcp",
    "x402",
    "ai-agents",
    "cloudflare-bypass",
    "anti-bot",
    "web-scraping",
    "marketplace-intelligence",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
license-files = ["LICENSE", "LICENSE-BSL-STEALTH"]

dependencies = [
    "qrcode>=8.0",
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    # Official Model Context Protocol Python SDK — primary stdio transport for
    # the `pry-mcp` / `pryscraper-mcp` entry points (sdk_server.py uses it when
    # present and falls back to a pure-httpx stdio server otherwise).
    "mcp>=1.0.0,<2.0",
    "trafilatura>=2.0.0",
    "readability-lxml>=0.8.1",
    "lxml>=5.3.0",
    "httpx>=0.28.0,<1.0",
    "markdownify>=0.14.0",
    "pydantic>=2.0.0,<3.0",
    "pydantic-settings>=2.0.0,<3.0",
    "playwright>=1.50.0,<2.0",
    "redis>=5.0.0,<6.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "tiktoken>=0.8.0",
    "pillow>=10.0.0",
    "click>=8.0.0,<9.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "anyio>=4.0.0",
    "croniter>=2.0.0",
    "structlog>=24.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "cloudscraper>=1.2.0",
    "aiohttp-socks[aiohttp]>=0.8.0",
    "aiohttp>=3.9.0",
    "undetected-chromedriver>=3.5.0",
    "pyjwt>=2.8.0",
    "apify>=2.0.0",
    "playwright-stealth>=1.0.0",
    # Self-hosted x402 facilitator: ecrecover + EIP-3009 signing (eth-keys),
    # tx signing/RLP for settlement broadcast (eth-account), keccak backend
    # (eth-hash[pycryptodome]). [REVIEW] new deps — lead reconciles lockfile.
    "eth-keys>=0.7.0",
    "eth-account>=0.13.0",
    "eth-hash[pycryptodome]>=0.8.0",
]

[project.urls]
Homepage = "https://pryscraper.com"
Repository = "https://git.rugmunch.io/RugMunchMedia/pryscraper"
# Codeberg is the canonical public mirror; kept in sync by the fleet
# push-all-repos pipeline.
Source = "https://codeberg.org/cryptorugmunch/pryscraper"
Changelog = "https://git.rugmunch.io/RugMunchMedia/pryscraper/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pre-commit>=4.0.0",
    "import-linter>=2.1",
    "alembic>=1.14.0",
    "respx>=0.21.0",
    "commitizen>=3.12.0",
    "hypothesis>=6.0.0",
    "pact-python>=2.0.0",
    # Postgres drivers for the integration test job. asyncpg is used by the
    # async engine (PRY_DATABASE_URL=postgresql+asyncpg://); psycopg2-binary
    # by the sync engine (db.session.session_scope). Both are required by
    # tests/test_integration_db_redis.py and the `integration-nightly` CI job.
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "vulture>=2.16",
    "radon>=6.0",
    "interrogate>=1.7",
    "deptry>=0.25",
    "pip-audit>=2.10",
]

# Optional scraping/parsing backends. These are deliberately NOT core
# dependencies: every module that uses them guards the import and returns a
# "pip install X" hint when missing. Install the whole group with
# `pip install pryscraper-mcp[scrape]`.
scrape = [
    "curl_cffi>=0.7.0",
    "camoufox>=0.4.0",
    "pdfplumber>=0.11.0",
    "pdfminer.six>=20221105",
    "pytesseract>=0.3.10",
    "easyocr>=1.7.0",
]

[project.scripts]
# Entry points target the real CLI module (src/pry/misc/cli.py). The previous
# `pry.core.cli` target broke the installed `pry` / `pry-mcp` binaries with
# ModuleNotFoundError (the CLI was moved to pry.misc.cli in the src-layout
# migration commit 07b025b).
pry = "pry.misc.cli:main"
# MCP stdio entry points — runnable via `uvx pryscraper-mcp`, `pipx install pryscraper`,
# or directly as `pry-mcp` / `pryscraper-mcp`. Backed by the click command that boots
# the MCP server over stdio (same path as `pry mcp serve` / `python -m mcp_production`).
# MCP registry identity (server.json): io.rugmunch/pry
pry-mcp = "pry.misc.cli:mcp_serve"
# Alias matching the publishable PyPI name (`uvx pryscraper-mcp` resolves a binary of
# the same name as the package).
pryscraper-mcp = "pry.misc.cli:mcp_serve"

# src-layout: all runtime modules live under src/pry/<domain>/. packages.find
# ships the whole pry package tree (A4 folded x402 into pry.payments).

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "pry*",
    "crypto_market*",
    "compliance*",
    "extraction*",
    "legal_docs*",
    "real_estate*",
    "jobs*",
    "travel*",
    "attention*",
    "local_data*",
    "gov_data*",
    "ip_data*",
    "site_catalog*",
    "sports_data*",
    "healthcare_data*",
    "commerce_data*",
    "climate_data*",
    "research_data*",
    "events_data*",
    "freight_data*",
    "energy_data*",
    "food_data*",
    "supply_data*",
    "app_store_data*",
    "news_data*",
    "compliance_data*",
    "deals_data*",
    "bidding_data*",
]

[tool.ruff]
extend = "../standards/templates/ruff-base.toml"
exclude = ["mutants", "build", "dist"]

[tool.ruff.lint]
extend-select = ["A", "BLE", "T201"]
extend-ignore = ["N815", "A002", "RUF006"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures legitimately hardcode dummy credentials / temp paths.
"tests/**" = ["S105", "S106", "S108"]
"tests/test_sports_sources.py" = ["B007", "PT018"]
"tests/fuzz/test_stealth_fuzz.py" = ["PT019"]
"tests/fuzz/test_parser_fuzz.py" = ["PT018"]
"tests/fuzz/test_extractor_fuzz.py" = ["PT018"]
"tests/test_integration_db_redis.py" = ["PT012"]
"tests/contract/test_rmi_backend_contract.py" = ["S105"]

# T201 (print) is banned in library code — use structlog/logging.
# Legitimate stdout output lives only in the CLI and standalone
# validation scripts; anything else must log, not print.
"src/pry/core/cli.py" = ["T201"]
"src/pry/misc/cli.py" = ["T201"]
"templates/**" = ["T201"]
"scripts/**" = ["T201"]
# Template validation CLIs — operator-facing stdout IS the interface.
"src/pry/commerce/templates/*" = ["T201"]

# ultimate_scraper.py: three intentional blind-except cleanup handlers
# (telemetry record, undetected driver quit, playwright browser close)
# log at debug with exc_info and must never raise into the scrape loop.
"src/pry/engine/ultimate_scraper.py" = ["BLE001"]
# browser_pool.py: the same intentional blind-except cleanup handlers moved
# out of ultimate_scraper into the process-level singleton pool.
"src/pry/engine/browser_pool.py" = ["BLE001"]
"src/pry/engine/scraping_methods.py" = ["BLE001"]
# camoufox_integration.py: intentional blind-except browser cleanup handlers
# (page.close / pooled __aexit__) log at debug with exc_info and must never
# raise into the scrape loop, so zombie browsers are surfaced not swallowed.
"src/pry/engine/camoufox_integration.py" = ["BLE001"]
"src/pry/api/capabilities.py" = ["BLE001"]
# Scraper fallback paths: any failure (network, parse, decode) must be
# swallowed + logged at debug so the scrape loop degrades instead of raising.
"src/pry/engine/ai_visual_scraper.py" = ["BLE001"]
"src/pry/engine/graphql_scraper_enhanced.py" = ["BLE001"]
"src/pry/engine/mobile_app_scraper.py" = ["BLE001"]
# x_intel actor: multi-strategy fetch chain (guest GraphQL -> nitter ->
# syndication -> webshare retry) — each strategy's failure must fall through
# to the next, logged at debug.
"actors/x_intel.py" = ["BLE001"]

# BLE001 (blind except Exception) is enforced. Pre-existing sites are
# marked with `# noqa: BLE001`; new code must use specific exception
# types (e.g. httpx.HTTPError, json.JSONDecodeError, OSError).

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    ".git/",
    "__pycache__/",
    # actor_factory/ holds 100+ independent standalone actor scripts, each
    # with its own main.py. mypy cannot type-check multiple same-named
    # modules in one invocation (duplicate-module error), and they are not
    # part of the `pry` package namespace. Excluded from the single-run gate.
    "actor_factory/",
    # mutants/ is mutation-testing output (mutmut), not source.
    "mutants/",
]
warn_unused_ignores = false
# TODO: Pry was built without strict typing; re-enable incrementally.
# Tracking issue: re-enable mypy strict mode after router refactor.
disable_error_code = [
    "dict-item",
    "index",
    "abstract",
    "func-returns-value",
]

[[tool.mypy.overrides]]
module = [
    # Strict-typed core (audit win #7 ratchet). These modules pass
    # `mypy --strict` today; regressions fail CI. Add modules here as
    # they are cleaned up — never remove without an ADR.
    "block_detection",
    "dedup",
    "errors",
    "extraction",
    "freshness",
    "parser",
    "paths",
    "quality",
    "ratelimit",
    "resilience",
    "retry",
    "sessions",
    "url_guard",
    # 2026-09-02 strict ratchet (audit win #7): modules verified clean under
    # `mypy --strict`. Add modules here as they are cleaned up — never remove
    # without an ADR. Fully-qualified names disambiguate modules that share a
    # bare name across the dual src/ + top-level layout (e.g. `client` exists
    # as both pry.api.client and pry.core.client; `gdpr` as compliance.gdpr,
    # pry.compliance.gdpr, and pry.api.routers.integrations.gdpr).
    "pry.core.audit",
    "pry.core.client",
    "pry.core.config_validation",
    "pry.compliance.gdpr",
    "pry.engine.network",
    "pry.core.secrets_backend",
    "pry.core.settings",
    "pry.engine.websocket_scraper",
]
strict = true

[[tool.mypy.overrides]]
module = [
    "trafilatura",
    "trafilatura.*",
    "readability",
    "readability.*",
    "playwright",
    "playwright.*",
    "pypdf",
    "pypdf.*",
    "docx",
    "docx.*",
    "PIL",
    "PIL.*",
    "markdownify",
    "markdownify.*",
    "pandas",
    "pandas.*",
    "yaml",
    "yaml.*",
    "numpy",
    "numpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Import paths for the dual-layout repo: `pry.*` lives in src/, while the
# routers/ package is still at the repo root (SYSTEM-AUDIT-V2 move A2 will
# remove the "." entry). Without this, bare `pytest` collects 168 import
# errors locally; CI only worked because it exports PYTHONPATH explicitly.
pythonpath = ["src", "."]
# Skip `integration` tests by default — they require live Postgres + Redis
# (and, for /ready, a reachable Ollama endpoint). Run them explicitly with:
#   pytest -m integration
# CI runs them nightly, non-blocking, in .forgejo/workflows/ci.yml
# (`integration-nightly` job) which starts ephemeral postgres:16 + redis:7
# containers and sets PRY_DATABASE_URL / PRY_REDIS_URL.
# `tests/contract/` is also excluded from the default run: pact tests start a
# native mock service and only make sense in the explicit `contract-test` job.
addopts = "-m 'not integration' --ignore=tests/contract"
markers = [
    "integration: tests that require live infrastructure (Postgres, Redis, external HTTP). Skipped by default; run with `pytest -m integration`.",
    "fuzz: marks tests as fuzz/property-based tests (can be slow)",
]

[tool.coverage.run]
branch = true
# Source scope for local `pytest --cov` / `coverage run` runs. CI uses
# `--cov=.` (see .forgejo/workflows/ci.yml) which measures the whole repo
# minus `omit`, so this list is the curated local-dev subset. Note:
# `routers/` (54 modules) and `pry_mcp/` (7 modules) were added 2026-08-16;
# `workers/` contains no Python sources and is kept for documentation
# (coverage.py ignores it).
# Removed stale entries `auth`, `tasks`, `pry_x402` — no such modules exist.
source = [
    "api",
    "cli",
    "extractor",
    "parser",
    "scraper",
    "monitor",
    "network",
    "cache",
    "errors",
    "paths",
    "settings",
    "db",
    "quality",
    "reports",
    "extraction",
    "x402",
    "x402_middleware",
    "routers/",
    "workers/",
    "pry_mcp",
]
omit = [
    "tests/*",
    "browser-extension/*",
    "shopify-app/*",
    "wordpress-plugin/*",
    "*/templates/*",
    "*/profiles/*",
    "*/stealth_scripts/*",
    "pry.egg-info/*",
    "build/*",
    "dist/*",
]

[tool.coverage.report]
fail_under = 75  # measured 76.0% whole-repo 2026-08-23; ratchet: 75 -> 77 -> 79 -> 81
precision = 1
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
]

[tool.deptry]
ignore = ["DEP002", "DEP003"]
# src-layout: pry is THIS package — self-imports are first-party, not
# missing dependencies. Legacy root dirs stay out of dependency scope.
known_first_party = ["pry", "legal_docs", "travel", "local_data", "jobs", "attention", "real_estate", "apify_actor"]
# camelot is an optional PDF-extraction extra (import-guarded at runtime)
per_rule_ignores = {"DEP001" = ["camelot"]}
exclude = ["tests", "datasets", ".venv"]

[tool.interrogate]
fail-under = 60
ignore-init-method = true
ignore-init-module = true
exclude = ["tests/*", "setup.py", "browser-extension/*", "shopify-app/*", "mutants/*"]

# mutmut 3.x — core parsing/extraction scope per AI Test Oracle Policy
[tool.mutmut]
source_paths = [
    "src/pry/engine/parser.py",
    "src/pry/engine/extraction.py",
    "src/pry/engine/extractor.py",
    "src/pry/engine/dedup.py",
    "src/pry/engine/quality.py",
]
pytest_add_cli_args_test_selection = ["tests/test_parser.py", "tests/test_extractor.py", "tests/test_quality.py", "tests/test_dedup.py", "tests/test_dedup_mutation.py", "tests/test_quality_mutation.py"]
# The mutation sandbox (mutants/) only receives source_paths; the rest of the
# pry package must be present for imports to resolve. Copy the full src tree
# pristine — mutmut then writes the mutated engine files on top of it.
also_copy = ["src"]
