# Tiered test gates sized for 3 runner slots.
#   smoke : PR gate, bounded unit core (split scenario suites + actor contracts +
#           tier system). No network, no slow, no integration; hard 60s per test.
#   full  : nightly only — everything, never a PR gate.
name: tests-tiered
on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # PR gate reduced to the ONE thing ci.yml does not already do (2026-11-21).
  #
  # This job used to also run a "smoke tier": the whole suite restricted to
  # `-m "not network and not slow and not integration"` over a directory subset.
  # ci.yml's `test` job already runs EVERY test with `not integration and not
  # slow`, so that step was a strict subset of a gate that already blocks --
  # same runner pool, same install, twice the wall clock. Removed.
  #
  # The collect-only step is kept because it is genuinely unique: it proves every
  # test module IMPORTS without executing anything, which catches a broken import
  # in seconds instead of 12 minutes into the real run. That is the cheap gate;
  # the expensive duplicate is gone.
  smoke:
    runs-on: docker-x64
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -e '.[dev]' pytest-xdist pytest-timeout
      - name: collect (import gate, must be 9627 of 9638)
        run: python3 -m pytest tests --collect-only -q
  full:
    if: github.event_name == 'schedule'
    runs-on: docker-x64
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -e '.[dev]' pytest-xdist pytest-timeout
      - name: full tier (everything, never a PR gate)
        run: python3 -m pytest tests -q -n 4 --dist loadfile --timeout=120
