name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # k6 smoke tests run against live deployment every 6 hours
    - cron: '0 */6 * * *'
    # Nightly integration tests (Postgres + Redis) — non-blocking
    - cron: '30 2 * * *'

env:
  UV_BIN: $HOME/.local/bin/uv

jobs:
  pre-commit-mirror:
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps + pre-commit
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl
          rm -rf /var/lib/apt/lists/*
          pip install pre-commit
      - name: Run ALL pre-commit hooks on all files
        run: pre-commit run --all-files --show-diff-on-failure

  commitlint:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to check all commits in PR
      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Validate all commits in PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Check all commits in the PR
            git log --format="%H %s" origin/main..HEAD | while read hash msg; do
              echo "$hash $msg" | commitlint --from="$hash^" --to="$hash" || exit 1
            done
          else
            # On push to main, just check the latest commit
            npx commitlint --from=HEAD~1 --to=HEAD
          fi

  semgrep:
    runs-on: docker-x64
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install semgrep
        run: pip install semgrep
      - name: Semgrep SAST scan
        run: |
          semgrep --config=auto \
            --error \
            --severity=ERROR \
            --exclude='tests/' \
            --exclude='.venv/' \
            --sarif=semgrep.sarif \
            .
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif

  lint:
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          ln -sf $HOME/.local/bin/uvx /usr/local/bin/uvx

      - name: Setup Python
        run: |
          uv python install 3.11
          uv venv --python 3.11 .venv

      - name: Install dependencies
        run: |
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint (ruff)
        run: source .venv/bin/activate && ruff check . --exit-non-zero-on-fix

      - name: Format check (ruff)
        # TODO: Fix 59 files needing reformat
        continue-on-error: true
        run: source .venv/bin/activate && ruff format --check .

  typecheck:
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4
      - name: Install uv + setup
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          ln -sf $HOME/.local/bin/uvx /usr/local/bin/uvx
          uv python install 3.11
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Type check (mypy)
        run: source .venv/bin/activate && mypy .

  test:
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4
      - name: Install uv + setup
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          ln -sf $HOME/.local/bin/uvx /usr/local/bin/uvx
          uv python install 3.11
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Test with coverage
        # Coverage floor: 45% (matches pyproject.toml [tool.coverage.report] fail_under)
        # `--cov=.` measures the whole repo (no `pryscraper` module exists — the
        # package is `pry` with top-level modules api/scraper/etc.). Omit list
        # comes from pyproject [tool.coverage.run]. Tests MUST pass — blocks the
        # pipeline on failure or insufficient coverage.
        run: source .venv/bin/activate && pytest tests/ -x -q --tb=short --cov=. --cov-report=xml:coverage.xml --cov-report=lcov:coverage.lcov --cov-fail-under=45 -m "not integration"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: unittests
          name: pryscraper
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  integration-nightly:
    # Nightly (non-blocking): runs tests marked `integration` against a real
    # Postgres + Redis stack. The repo docker-compose.yml declares pry-redis /
    # pry-postgres volumes but no services, so this job spins up ephemeral
    # postgres:16 + redis:7 containers via the `services:` block. Deliberately
    # continue-on-error: infra flakiness must never block mainline CI.
    # Run locally with:  pytest -m integration  (requires PG+Redis reachable)
    if: github.event_name == 'schedule'
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pry
          POSTGRES_PASSWORD: pry
          POSTGRES_DB: pry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pry -d pry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4
      - name: Install uv + setup
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          ln -sf $HOME/.local/bin/uvx /usr/local/bin/uvx
          uv python install 3.11
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Run integration tests (Postgres + Redis)
        env:
          PRY_DATABASE_URL: postgresql+asyncpg://pry:pry@postgres:5432/pry
          PRY_REDIS_URL: redis://redis:6379/0
        run: source .venv/bin/activate && pytest tests/ -m integration -q --tb=short || echo "integration tests failed (non-blocking)"
        continue-on-error: true

  crucible-gate:
    runs-on: docker-x64
    needs: test
    container:
      image: python:3.11-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc curl git ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          uv python install 3.11 && uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]" mutmut
          pip install crucible-harden 2>/dev/null || echo "Crucible not on PyPI yet"
      - name: Crucible mutation gate
        run: |
          source .venv/bin/activate
          if command -v crucible &>/dev/null; then
            crucible score . --module pry || echo "Crucible gate noted"
          else
            mutmut run --paths-to-mutate . 2>/dev/null && mutmut results || echo "Mutation gate noted"
          fi
        continue-on-error: true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          apt-get update && apt-get install -y --no-install-recommends wget git ca-certificates && rm -rf /var/lib/apt/lists/*
          wget -qO- https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner --exit-code 1 --config .gitleaks.toml

  security:
    name: Security audit (bandit)
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4
      - name: Install uv + setup
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          ln -sf $HOME/.local/bin/uvx /usr/local/bin/uvx
          uv python install 3.11
          uv venv --python 3.11 /tmp/bandit-venv
          uv pip install --python /tmp/bandit-venv/bin/python bandit
      - name: Bandit (high+medium severity)
        run: source /tmp/bandit-venv/bin/activate && bandit -r . -x tests/,.venv,__pycache__ -ll -f json -o bandit-report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
        if: always()

  shellcheck:
    runs-on: docker-x64
    container:
      image: koalaman/shellcheck-alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck all shell scripts
        run: |
          find . -name "*.sh" -not -path "*/node_modules/*" -not -path "*/.venv/*" -not -path "*/sdks/*" -exec shellcheck -x {} +

  trivy-scan:
    runs-on: docker-x64
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scanning
        run: docker build -t app:${{ github.sha }} .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif

  pip-audit:
    runs-on: docker-x64
    needs: test
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install pip-audit + deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc git ca-certificates curl
          rm -rf /var/lib/apt/lists/*
          pip install pip-audit
          pip install -r requirements.txt 2>/dev/null || true
      - name: Run pip-audit (blocking on HIGH/CRITICAL)
        run: |
          pip-audit --fail-on=high --desc 2>&1 || { echo "❌ pip-audit found HIGH/CRITICAL vulnerabilities — fix before merge"; exit 1; }

  deps-freshness:
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Check dependency freshness
        run: |
          pip install libyear 2>/dev/null || true
          if [ -f requirements.txt ]; then
            pip install pip-tools && libyear --file requirements.txt || echo "Dep freshness check noted"
          fi
        continue-on-error: true

  k6-smoke:
    # k6 needs a RUNNING pryscraper service to test against. In PR CI the
    # Docker Compose stack (pryscraper + FlareSolverr) would need to be built
    # and started, and secrets (PRY_API_KEY, etc.) are not available in PR
    # context. Runs on schedule against the live deployment instead.
    # To enable: set K6_TARGET_URL as a repo variable (vars) or secret
    # pointing to the deployed service (set as a repository variable).
    if: github.event_name == 'schedule'
    runs-on: docker-x64
    container:
      image: grafana/k6:latest
    steps:
      - uses: actions/checkout@v4
      - name: Create results directory
        run: mkdir -p tests/k6/results
      - name: Run k6 smoke test against live deployment
        run: |
          k6 run tests/k6/smoke.js \
            -e BASE_URL=${{ vars.K6_TARGET_URL || 'https://pry.example.com' }} \
            --summary-export=tests/k6/results/smoke-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-smoke-report
          path: tests/k6/results/

  fuzz:
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    needs: test
    steps:
      - name: Install Node.js + deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates gcc libpq-dev git
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
      - name: Setup uv + deps
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          uv python install 3.11 && uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]" hypothesis
      - name: Run fuzz tests
        run: |
          source .venv/bin/activate
          HYPOTHESIS_PROFILE=ci python -m pytest tests/fuzz/ -v --tb=short || echo "Fuzz tests noted (non-blocking)"
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-results
          path: .hypothesis/

  contract-test:
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    needs: test
    steps:
      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates gcc git
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
      - name: Setup uv + deps
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          uv python install 3.11 && uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]" pact-python
      - name: Run consumer contract tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/contract/ -v --tb=short
      - name: Upload pact files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pacts
          path: tests/contract/pacts/

  sbom:
    runs-on: docker-x64
    needs: [test, typecheck]
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output: sbom.spdx.json
      - name: Verify SBOM (blocking — bad SBOM = broken build)
        run: |
          if [ -f sbom.spdx.json ]; then
            bash scripts/sbom-verify.sh sbom.spdx.json
          else
            echo "❌ SBOM file not generated"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  sign-image:
    runs-on: docker-x64
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.3'
      - name: Build Docker image
        run: docker build -t registry.example.com/pryscraper:${{ github.sha }} .
      - name: Push to registry
        run: docker push registry.example.com/pryscraper:${{ github.sha }}
      - name: Sign image with keyless (OIDC)
        run: |
          cosign sign --yes registry.example.com/pryscraper:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: "1"
      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity "https://git.example.com/org/pryscraper/.forgejo/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://git.example.com" \
            registry.example.com/pryscraper:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: "1"

  ocr-review:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Open Code Review
        run: npm install -g @alibaba-group/open-code-review@latest || echo "OCR install skipped (will retry next run)"
        continue-on-error: true
      - name: Configure OCR
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
        run: |
          if command -v ocr &>/dev/null; then
            ocr config set llm.url "$OCR_LLM_URL"
            ocr config set llm.auth_token "$OCR_LLM_AUTH_TOKEN"
            ocr config set llm.model "$OCR_LLM_MODEL"
            ocr config set llm.use_anthropic false
            ocr config set llm.extra_body '{"thinking": {"type": "disabled"}}'
            ocr config set language English
          else
            echo "OCR not installed — skipping config"
          fi
        continue-on-error: true
      - name: Run OCR code review
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
        run: |
          if command -v ocr &>/dev/null; then
            TARGET_BRANCH="${GITHUB_BASE_REF:-main}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            if [ -n "$HEAD_SHA" ]; then
              git fetch origin "$TARGET_BRANCH" 2>/dev/null || true
              ocr review \
                --from "origin/$TARGET_BRANCH" \
                --to "$HEAD_SHA" \
                --format json \
                > /tmp/ocr-result.json 2>/tmp/ocr-stderr.log || echo "OCR review completed with findings"
              echo "=== OCR result ==="
              cat /tmp/ocr-result.json
            else
              echo "Not a PR event — skipping review"
            fi
          else
            echo "OCR not installed — skipping (non-blocking)"
          fi
        continue-on-error: true
      - name: Upload OCR report
        uses: actions/upload-artifact@v4
        with:
          name: ocr-review-report
          path: |
            /tmp/ocr-result.json
            /tmp/ocr-stderr.log
        continue-on-error: true

  archfit:
    runs-on: docker-x64
    container:
      image: golang:1.22-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install archfit
        run: go install github.com/alexei-led/archfit/cmd/archfit@latest || echo "archfit install skipped"
        continue-on-error: true
      - name: Run architecture fitness check
        run: |
          if command -v archfit &>/dev/null; then
            archfit analyze
          else
            echo "archfit not installed — skipping (non-blocking)"
          fi
