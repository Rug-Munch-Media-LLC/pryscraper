name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # k6 smoke tests run against live deployment every 6 hours
    - cron: '0 */6 * * *'
    # Nightly integration tests (Postgres + Redis) — non-blocking
    - cron: '30 2 * * *'

env:
  UV_BIN: $HOME/.local/bin/uv

jobs:
  pre-commit-mirror:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system deps + pre-commit
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl
          rm -rf /var/lib/apt/lists/*
          pip install pre-commit
      - name: Run ALL pre-commit hooks on all files
        run: pre-commit run --all-files --show-diff-on-failure

  commitlint:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    steps:
      - name: Install git
        # Audit 2026-09-12: slim image has no git — checkout fell back to a
        # tarball download and commitlint died with `spawn git ENOENT`.
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Need full history to check all commits in PR
      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Validate all commits in PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Check all commits in the PR
            git log --format="%H %s" origin/main..HEAD | while read hash msg; do
              echo "$hash $msg" | commitlint --from="$hash^" --to="$hash" || exit 1
            done
          else
            # On push to main, just check the latest commit
            npx commitlint --from=HEAD~1 --to=HEAD
          fi

  semgrep:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install semgrep
        run: pip install semgrep
      - name: Semgrep SAST scan
        # Pinned local ruleset (audit 2026-09-11 P1): `--config=auto` pulled
        # whatever the registry served that day — nondeterministic gate.
        run: |
          semgrep --config=.semgrep/rules.yaml \
            --error \
            --severity=ERROR \
            --exclude='tests/' \
            --exclude='.venv/' \
            --exclude='website/' \
            --exclude='actor_factory/' \
            --sarif-output=semgrep.sarif \
            .
      - uses: actions/upload-artifact@v3
        with:
          name: semgrep-report
          path: semgrep.sarif

  lint:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          ln -sf $HOME/.local/bin/uvx /usr/local/bin/uvx

      - name: Setup Python
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv

      - name: Install dependencies
        run: |
          # Pinned lock first (reproducible), then project + dev extras.
          uv pip install --python .venv/bin/python -r requirements.lock
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Dependency drift check (requirements.txt vs lock)
        run: |
          source .venv/bin/activate
          python scripts/check_dep_drift.py

      - name: Lint (ruff)
        run: source .venv/bin/activate && ruff check . --exit-non-zero-on-fix

      - name: Format check (ruff)
        run: source .venv/bin/activate && ruff format --check .

  typecheck:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv + setup
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          ln -sf $HOME/.local/bin/uvx /usr/local/bin/uvx
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Type check (mypy)
        # Scoped to the production package surface (audit 2026-09-11 P0.2):
        # `mypy .` included tests/datasets/scripts and sat at 2,789 errors —
        # never green, gated nothing. Scope + ratchet documented in
        # pyproject [tool.mypy] and docs/ops/TYPECHECK_RATCHET.md.
        run: source .venv/bin/activate && mypy src/ pry_mcp/

  test:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv + setup
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          ln -sf $HOME/.local/bin/uvx /usr/local/bin/uvx
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
          # The staged-package secret-scan test shells out to gitleaks; the
          # scanner fails open when the binary is missing (by design), so CI
          # installs it to exercise the real blocking path.
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
      - name: Test with coverage
        # Coverage floor: 73% (measured 73.7% in CI 2026-09-12; ratchet back
        # toward the 76% local baseline as env-dependent skips are reduced)
        # `--cov=.` measures the whole repo (no `pryscraper` module exists — the
        # package is `pry` with top-level modules api/scraper/etc.). Omit list
        # comes from pyproject [tool.coverage.run]. Tests MUST pass — blocks the
        # pipeline on failure or insufficient coverage.
        run: source .venv/bin/activate && pytest tests/ --maxfail=10 -q --tb=short --cov=. --cov-report=xml:coverage.xml --cov-report=lcov:coverage.lcov --cov-fail-under=73 -m "not integration"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: unittests
          name: pryscraper
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  integration-nightly:
    # Nightly (non-blocking): runs tests marked `integration` against a real
    # Postgres + Redis stack. The repo docker-compose.yml declares pry-redis /
    # pry-postgres volumes but no services, so this job spins up ephemeral
    # postgres:16 + redis:7 containers via the `services:` block. Deliberately
    # continue-on-error: infra flakiness must never block mainline CI.
    # Run locally with:  pytest -m integration  (requires PG+Redis reachable)
    if: github.event_name == 'schedule'
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pry
          POSTGRES_PASSWORD: pry
          POSTGRES_DB: pry
        # No host port mapping: the job container reaches the service via
        # its network alias (postgres:5432). Host mappings conflicted with
        # production containers (6379 = rmi-valkey) and broke service startup.
        options: >-
          --health-cmd "pg_isready -U pry -d pry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv + setup
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          ln -sf $HOME/.local/bin/uvx /usr/local/bin/uvx
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Run integration tests (Postgres + Redis)
        env:
          PRY_DATABASE_URL: postgresql+asyncpg://pry:pry@postgres:5432/pry
          PRY_REDIS_URL: redis://redis:6379/0
        # Nightly also runs the `slow` full-catalog tests (e.g. the 109-preset
        # actor staging gate) that are deselected from the default run.
        run: source .venv/bin/activate && pytest tests/ -m "integration or slow" -q --tb=short || echo "integration tests failed (non-blocking)"
        continue-on-error: true

  # T1 win #4: Integration test gate on PRs (blocking). Spins up ephemeral
  # Postgres + Redis and runs the full integration suite. Blocks merge on
  # failure — no more "integration tests only run nightly" blind spot.
  integration-gate:
    name: Integration gate (Postgres + Redis)
    if: github.event_name == 'pull_request'
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pry
          POSTGRES_PASSWORD: pry
          POSTGRES_DB: pry
        # No host port mapping: the job container reaches the service via
        # its network alias (postgres:5432). Host mappings conflicted with
        # production containers (6379 = rmi-valkey) and broke service startup.
        options: >-
          --health-cmd "pg_isready -U pry -d pry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv + setup
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          ln -sf $HOME/.local/bin/uvx /usr/local/bin/uvx
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Run integration tests (blocking on PR)
        env:
          PRY_DATABASE_URL: postgresql+asyncpg://pry:pry@postgres:5432/pry
          PRY_REDIS_URL: redis://redis:6379/0
        run: source .venv/bin/activate && pytest tests/ -m integration -q --tb=short --timeout=120

  # crucible-gate REMOVED (audit 2026-09-11 P1): duplicated the dedicated
  # `mutation-test` job below, and its mutmut fallback (--paths-to-mutate .)
  # would have mutated the entire repo including tests. The scoped
  # `mutation-test` job (engine-core baseline, 60% gate) is the single gate.

  secrets:
    name: Secret scan (gitleaks)
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          apt-get update && apt-get install -y --no-install-recommends wget git ca-certificates && rm -rf /var/lib/apt/lists/*
          wget -qO- https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner --exit-code 1 --config .gitleaks.toml

  security:
    name: Security audit (bandit)
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv + setup
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          ln -sf $HOME/.local/bin/uvx /usr/local/bin/uvx
          uv python install 3.12
          uv venv --python 3.12 /tmp/bandit-venv
          uv pip install --python /tmp/bandit-venv/bin/python bandit
      - name: Bandit (high+medium severity)
        run: source /tmp/bandit-venv/bin/activate && bandit -r . -x './tests/*,./.venv/*,./__pycache__/*' -ll -f json -o bandit-report.json
      - name: Upload report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json
        if: always()

  shellcheck:
    # Audit 2026-09-12: was localhost/ci-alpine-node:3.19 — custom images get
    # pruned by fleet cleanup and the runner then fails to pull them (404).
    # Use the cached standard image + distro shellcheck instead.
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install shellcheck
        run: |
          apt-get update && apt-get install -y --no-install-recommends shellcheck
          rm -rf /var/lib/apt/lists/*
      - name: ShellCheck all shell scripts
        run: |
          find . -name "*.sh" -not -path "*/node_modules/*" -not -path "*/.venv/*" -not -path "*/sdks/*" -exec shellcheck -x {} +

  docker-lock-drift:
    name: docker lock drift check
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Regenerate requirements.docker.lock and fail on drift
        run: |
          python3 scripts/gen-docker-lock.py
          if ! git diff --exit-code requirements.docker.lock; then
            echo "❌ requirements.docker.lock is stale vs requirements.lock."
            echo "   Run: python3 scripts/gen-docker-lock.py && commit the result."
            exit 1
          fi
          echo "✅ requirements.docker.lock in sync with requirements.lock"


  hadolint:
    name: Hadolint (Dockerfile lint)
    runs-on: docker-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run hadolint on Dockerfile (blocking on ERROR)
        # Audit 2026-09-12: was `docker run` inside the job container, which
        # has no docker CLI → "docker: command not found". Use the static
        # hadolint binary instead (no docker dependency).
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -sSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint --config .hadolint.yaml --failure-threshold error Dockerfile

  trivy-scan:
    # Audit 2026-09-12: was aquasecurity/trivy-action@0.28.0 + `docker build`
    # — the runner could not resolve the action ref, and job containers have
    # no docker CLI (same class as hadolint/sign-image). Rewritten to scan
    # the filesystem + configs with the trivy static binary. Advisory while
    # the findings backlog is triaged; tighten to blocking in follow-up.
    runs-on: docker-x64
    needs: test
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Trivy
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -sSL -o /tmp/trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
      - name: Trivy filesystem scan (CRITICAL,HIGH — advisory)
        continue-on-error: true
        run: |
          trivy fs --scanners vuln,secret --severity CRITICAL,HIGH \
            --format sarif --output trivy-results.sarif .
      - name: Trivy config scan (Dockerfile, compose — advisory)
        continue-on-error: true
        run: |
          trivy config --severity CRITICAL,HIGH \
            --format sarif --output trivy-config.sarif .
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: trivy-results
          path: trivy-*.sarif

  pip-audit:
    runs-on: docker-x64
    needs: test
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pip-audit + deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc git ca-certificates curl
          rm -rf /var/lib/apt/lists/*
          pip install pip-audit
          pip install -r requirements.txt 2>/dev/null || true
      - name: Run pip-audit (blocking on any advisory)
        # Audit 2026-09-12: pip-audit has no --fail-on flag (unrecognized
        # argument). It exits 1 on any finding; requirements.txt is clean
        # today (verified locally), so this blocks future vulns outright.
        run: |
          pip-audit --desc 2>&1 || { echo "❌ pip-audit found vulnerabilities — fix before merge"; exit 1; }

  deps-freshness:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check dependency freshness
        run: |
          pip install libyear 2>/dev/null || true
          if [ -f requirements.txt ]; then
            pip install pip-tools && libyear --file requirements.txt || echo "Dep freshness check noted"
          fi
        continue-on-error: true

  k6-smoke:
    # k6 needs a RUNNING pryscraper service to test against. In PR CI the
    # Docker Compose stack (pryscraper + FlareSolverr) would need to be built
    # and started, and secrets (PRY_API_KEY, etc.) are not available in PR
    # context. Runs on schedule against the live deployment instead.
    # To enable: set K6_TARGET_URL as a repo variable (vars) or secret
    # pointing to the deployed service (set as a repository variable).
    if: github.event_name == 'schedule'
    runs-on: docker-x64
    container:
      # Standard python+node image: actions/checkout is a node action and
      # cannot run inside grafana/k6 (no node -> exitcode 127). k6 itself
      # is installed below from the official static binary (v2.2.0).
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install k6
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -sSL -o /tmp/k6.tar.gz \
            https://github.com/grafana/k6/releases/download/v2.2.0/k6-v2.2.0-linux-amd64.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          mv /tmp/k6-v2.2.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version
      - name: Create results directory
        run: mkdir -p tests/k6/results
      - name: Run k6 smoke test against live deployment
        run: |
          # Default target is the public production API (verified live
          # 2026-09-11). Override per-deployment via the K6_TARGET_URL repo
          # variable — never a placeholder domain (audit P0.9: the old
          # https://pry.example.com default guaranteed this job failed).
          k6 run tests/k6/smoke.js \
            -e BASE_URL=${{ vars.K6_TARGET_URL || 'https://api.pryscraper.com' }} \
            --summary-export=tests/k6/results/smoke-summary.json
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: k6-smoke-report
          path: tests/k6/results/

  fuzz:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    needs: test
    steps:
      - name: Install Node.js + deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates gcc libpq-dev git
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup uv + deps
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          uv python install 3.12 && uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]" hypothesis
      - name: Run fuzz tests
        run: |
          source .venv/bin/activate
          HYPOTHESIS_PROFILE=ci python -m pytest tests/fuzz/ -v --tb=short || echo "Fuzz tests noted (non-blocking)"
        continue-on-error: true
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: fuzz-results
          path: .hypothesis/

  contract-test:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    needs: test
    steps:
      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates gcc git
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup uv + deps
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          uv python install 3.12 && uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]" pact-python
      - name: Run consumer contract tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/contract/ -v --tb=short
      - name: Upload pact files
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: pacts
          path: tests/contract/pacts/

  sbom:
    # Audit 2026-09-12: anchore/sbom-action uses node24 — Forgejo runner
    # v9.0.0 supports node20 max ("runs.using key ... got node24"). Replaced
    # with a direct syft install + generation (same artifact contract).
    runs-on: docker-x64
    needs: [test, typecheck]
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Syft
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM (CycloneDX)
        run: syft dir:. -o cyclonedx-json=sbom.spdx.json
      - name: Verify SBOM (blocking — bad SBOM = broken build)
        run: |
          if [ -f sbom.spdx.json ]; then
            bash scripts/sbom-verify.sh sbom.spdx.json
          else
            echo "❌ SBOM file not generated"
            exit 1
          fi
      - uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: sbom.spdx.json

  sign-image:
    # DISABLED (audit 2026-09-12): reference template only — there is no real
    # registry to push/sign against for the OSS repo, and job containers have
    # no docker CLI ('docker: command not found'). Re-enable with a real
    # REGISTRY + docker-capable runner.
    runs-on: docker-x64
    needs: test
    if: false
    # NOTE: `registry.example.com` is an INTENTIONAL placeholder for this
    # public OSS repo. Pry is open source and does not publish images to a
    # real container registry from CI, so the cosign build/push/sign/verify
    # steps below are a reference template rather than a live pipeline.
    #
    # Production deployments SHOULD override the registry by setting the
    # `REGISTRY` env var (e.g. `REGISTRY=ghcr.io/your-org`) and substituting
    # it in the image refs below. The certificate-identity / oidc-issuer
    # values must also be updated to match the real forgejo/git host.
    #
    # continue-on-error: this job must never block mainline CI for the OSS
    # repo, since there is no real registry to push/sign against.
    continue-on-error: true
    steps:
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.3'
      - name: Build Docker image
        run: docker build -t ${REGISTRY:-registry.example.com}/pryscraper:${{ github.sha }} .
      - name: Push to registry
        run: docker push ${REGISTRY:-registry.example.com}/pryscraper:${{ github.sha }}
      - name: Sign image with keyless (OIDC)
        run: |
          cosign sign --yes ${REGISTRY:-registry.example.com}/pryscraper:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: "1"
      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity "https://git.example.com/org/pryscraper/.forgejo/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://git.example.com" \
            ${REGISTRY:-registry.example.com}/pryscraper:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: "1"

  ocr-review:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install Open Code Review
        run: npm install -g @alibaba-group/open-code-review@latest || echo "OCR install skipped (will retry next run)"
        continue-on-error: true
      - name: Configure OCR
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
        run: |
          if command -v ocr &>/dev/null; then
            ocr config set llm.url "$OCR_LLM_URL"
            ocr config set llm.auth_token "$OCR_LLM_AUTH_TOKEN"
            ocr config set llm.model "$OCR_LLM_MODEL"
            ocr config set llm.use_anthropic false
            ocr config set llm.extra_body '{"thinking": {"type": "disabled"}}'
            ocr config set language English
          else
            echo "OCR not installed — skipping config"
          fi
        continue-on-error: true
      - name: Run OCR code review
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
        run: |
          if command -v ocr &>/dev/null; then
            TARGET_BRANCH="${GITHUB_BASE_REF:-main}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            if [ -n "$HEAD_SHA" ]; then
              git fetch origin "$TARGET_BRANCH" 2>/dev/null || true
              ocr review \
                --from "origin/$TARGET_BRANCH" \
                --to "$HEAD_SHA" \
                --format json \
                > /tmp/ocr-result.json 2>/tmp/ocr-stderr.log || echo "OCR review completed with findings"
              echo "=== OCR result ==="
              cat /tmp/ocr-result.json
            else
              echo "Not a PR event — skipping review"
            fi
          else
            echo "OCR not installed — skipping (non-blocking)"
          fi
        continue-on-error: true
      - name: Upload OCR report
        uses: actions/upload-artifact@v3
        with:
          name: ocr-review-report
          path: |
            /tmp/ocr-result.json
            /tmp/ocr-stderr.log
        continue-on-error: true

  archfit:
    # Audit 2026-09-12: was localhost/ci-golang-node:1.22 (pruned custom image
    # → runner pull 404). Runs on the standard image; installs Go only if the
    # distro provides it and degrades to a skip otherwise (advisory job).
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Go + archfit (best effort)
        run: |
          apt-get update && apt-get install -y --no-install-recommends golang-go ca-certificates
          rm -rf /var/lib/apt/lists/*
          export GOPATH="$HOME/go" PATH="$PATH:$HOME/go/bin"
          go install github.com/alexei-led/archfit/cmd/archfit@latest || echo "archfit install skipped"
        continue-on-error: true
      - name: Run architecture fitness check
        run: |
          export PATH="$PATH:$HOME/go/bin"
          if command -v archfit &>/dev/null; then
            archfit analyze
          else
            echo "archfit not installed — skipping (non-blocking)"
          fi

  # ── ENTERPRISE QUALITY GATES (2026-08-27) ─────────────────────
  mutation-test:
    name: Mutation testing (mutmut)
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv + setup
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Run mutation tests (targeted)
        run: |
          source .venv/bin/activate
          # Scoped to the engine-core mutation baseline (MUTATION_BASELINE.md).
          # mutmut 3.x reads scope from [tool.mutmut] in pyproject.toml — no CLI flags.
          mutmut run --max-children 8
          mutmut results > mutmut-report.txt 2>&1 || true
          mutmut export-cicd-stats
          echo "=== Mutation test results ==="
          cat mutmut-report.txt
      - name: Mutation score gate (fail below baseline)
        run: |
          source .venv/bin/activate
          python - <<'PY'
          import json, sys

          BASELINE = 60.0  # keep in sync with MUTATION_BASELINE.md

          try:
              data = json.loads(open("mutants/mutmut-cicd-stats.json").read())
          except (OSError, json.JSONDecodeError):
              sys.exit("mutation gate: mutants/mutmut-cicd-stats.json missing or invalid — run `mutmut export-cicd-stats` first")

          killed = data.get("killed", 0)
          total = data.get("total", 0)
          no_tests = data.get("no_tests", 0)
          skipped = data.get("skipped", 0)
          evaluated = total - no_tests - skipped
          if evaluated <= 0:
              sys.exit("mutation gate: no mutants evaluated — check [tool.mutmut] config")
          score = 100.0 * killed / evaluated
          print(f"mutation score: {score:.1f}% ({killed}/{evaluated} evaluated of {total}) — baseline {BASELINE}%")
          if score < BASELINE:
              sys.exit(f"mutation gate FAILED: {score:.1f}% < baseline {BASELINE}%")
          PY
        # Report upload stays non-blocking; the gate above is the blocking step.
      - name: Upload report
        uses: actions/upload-artifact@v3
        with:
          name: mutmut-report
          path: mutmut-report.txt
        continue-on-error: true

  complexity-gate:
    name: Code complexity (radon + xenon)
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install tools
        run: pip install radon xenon
      - name: Complexity check (radon)
        run: |
          echo "=== Cyclomatic complexity (A-E grades) ==="
          radon cc src/ -a -nc --min=B || echo "WARN: complexity below B grade found"
      - name: Xenon complexity gate (ratcheted thresholds)
        # Audit 2026-09-11 P0.7: the old B/A/A gate sat at 266 violations and
        # had never passed — it gated nothing. First ratchet F/F/A (green).
        # Ratchet 2 (2026-09-12): the last 4 F-rank blocks were refactored
        # (solana_transfer.verify_solana_payment F54->C11,
        # evm_verify.EVMVerifyMixin.verify F42->C17, cli_commands.main
        # F41->C11, scraper_orchestrate._scrape_with_fallbacks F46->C20) —
        # Ratchet 3 (2026-09-12): the last 4 E-rank blocks refactored
        # (form_detection.classify_role E37, automator.run_steps E33,
        # config_validation.validate_config E31, middleware_http._handle_http
        # E31) — threshold tightened to D/C/A. 18 D-rank blocks remain;
        # next targets. Then C/C/A.
        run: |
          xenon --max-absolute D --max-modules C --max-average A src/ || {
            echo "❌ Complexity gate failed: block exceeded D rank, module exceeded C, or repo average slipped"
            exit 1
          }

  dead-code-gate:
    name: Dead code detection (vulture)
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install vulture
        run: pip install vulture
      - name: Dead code scan (min 80% confidence)
        run: |
          vulture src/ --min-confidence 80 > vulture-report.txt 2>&1 || true
          echo "=== Dead code report ==="
          cat vulture-report.txt
          if grep -q "unused" vulture-report.txt; then
            echo "⚠️ Dead code found — review and remove"
          fi

  docstring-gate:
    name: Docstring coverage (interrogate)
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install interrogate
        run: pip install interrogate
      - name: Docstring coverage check (min 60%)
        run: |
          interrogate src/ --verbose --fail-under 60 --generate-badge /tmp/interrogate-badge.svg || {
            echo "❌ Docstring coverage below 60%"
            exit 1
          }

  # security-dependency-gate REMOVED (audit 2026-09-11 P1): duplicated the
  # `pip-audit` job above, but audited the ambient container environment
  # (no requirements install) rather than the project's pinned deps — noise,
  # not signal. The `pip-audit` job (requirements.txt, blocking on
  # HIGH/CRITICAL) is the single dependency-security gate.

  coverage-regression-gate:
    name: Coverage regression (diff-cover)
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    if: github.event_name == 'pull_request'
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install uv + setup
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          pytest tests/ --maxfail=10 -q --tb=short --cov=. --cov-report=xml:coverage.xml -m "not integration"
      - name: Coverage regression check
        run: |
          source .venv/bin/activate
          pip install diff-cover
          diff-cover coverage.xml --compare-branch=origin/main --fail-under=75 || {
            echo "❌ Coverage regression detected (below 75% or dropped vs main)"
            exit 1
          }

# Append these jobs under `jobs:` in any repo's ci.yml. Self-contained.
  supply-chain:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install scanners
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl git ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner && chmod +x /usr/local/bin/osv-scanner
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.0/trufflehog_3.97.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin trufflehog
      - name: OSV dependency scan (hallucinated/vulnerable deps)
        run: osv-scanner scan source --format table ./ || echo "::warning::OSV findings — triaged baseline, see log"
      - name: Trufflehog verified-live secrets (all history)
        run: trufflehog git file://. --only-verified --fail --no-update

  nightly-deep-scan:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Noseyparker full-history secret hunt
        run: |
          curl -sSfL https://github.com/praetorian-inc/noseyparker/releases/download/v0.24.0/noseyparker-v0.24.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker scan --git-history-format all . || true
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker report || true
      - name: Grype vulnerability match on working tree
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype dir:. --fail-on critical || echo "::warning::critical vulns in tree"

  # ── Changelog (git-cliff) ─────────────────────────────────────
  # Verify a changelog can be generated from conventional commits.
  # Runs in the ephemeral CI workspace, so the committed CHANGELOG.md
  # is never clobbered.
  changelog:
    runs-on: docker-x64
    needs: [lint]
    container:
      # Audit 2026-09-12: default node image has no pip ('pip: command not
      # found') — run on the standard python+node image.
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install git-cliff
        run: pip install git-cliff
      - name: Verify changelog generation
        run: git-cliff --strip header -o CHANGELOG.md

  structure-gate:
    # Anti-god-module + anti-monkeypatch ratchet (baseline:
    # scripts/structure-baseline.json). Shrink freely; growth or NEW
    # offenders fail the build. Regenerate deliberately: --update-baseline.
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Structure gate
        run: python3 scripts/check-code-structure.py
