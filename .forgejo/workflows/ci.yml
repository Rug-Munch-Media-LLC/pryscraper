name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # k6 smoke tests run against live deployment every 6 hours
    - cron: '0 */6 * * *'
    # Nightly integration tests (Postgres + Redis) — non-blocking
    - cron: '30 2 * * *'
  # Manual trigger: lets operators re-run CI on demand (e.g. after a workflow
  # fix) without pushing a dummy commit. Added 2026-10-05 after a duplicate
  # YAML key silently stopped all ci.yml scheduling.
  workflow_dispatch: {}

env:
  UV_BIN: $HOME/.local/bin/uv

# Cancel superseded runs. Without this, every push to a PR starts a fresh
# 32-job run while the previous one keeps burning CPU to completion -- pure
# waste, and on this host it is what pushed load high enough for the CI
# kill-switch to stop the runners entirely.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit-mirror:
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system deps + pre-commit
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl
          rm -rf /var/lib/apt/lists/*
          pip install pre-commit
      - name: Restore pre-commit hook cache
        # PRE-COMMIT INSTALLS FIVE HOOK ENVIRONMENTS FROM SOURCE ON EVERY RUN
        # (ruff-pre-commit, mirrors-mypy, gitleaks, bandit, pre-commit-hooks) and
        # says so itself: "Installing environment for ... This may take a few
        # minutes". Measured locally: those environments are 425MB.
        #
        # That build is the longest step in this job, and on this host it is
        # repeatedly killed by an overlay2 fault (`RWLayer ... is unexpectedly
        # nil`, 169 occurrences in 24h). Measured: 9 of 9 runs failed here while
        # the identical job passed on two smaller repos.
        #
        # `actions/cache` routes to the runner's persistent host cache, so the
        # build happens once. Keyed on the hook config's hash, so changing a hook
        # correctly invalidates it.
        uses: actions/cache@v3
        with:
          path: ~/.cache/pre-commit
          key: precommit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            precommit-${{ runner.os }}-
      - name: Run ALL pre-commit hooks on all files
        run: pre-commit run --all-files --show-diff-on-failure

  semgrep:
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install semgrep
        run: pip install semgrep
      - name: Semgrep SAST scan
        # Pinned local ruleset (audit 2026-09-11 P1): `--config=auto` pulled
        # whatever the registry served that day — nondeterministic gate.
        run: |
          semgrep --config=.semgrep/rules.yaml \
            --error \
            --severity=ERROR \
            --exclude='tests/' \
            --exclude='.venv/' \
            --exclude='website/' \
            --exclude='actor_factory/' \
            --sarif-output=semgrep.sarif \
            .
      - uses: actions/upload-artifact@v3
        with:
          name: semgrep-report
          path: semgrep.sarif

  lint:
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          ln -sf $HOME/.local/bin/uvx /usr/local/bin/uvx

      - name: Setup Python
        run: |
          uv python install 3.12
          uv venv --allow-existing --python 3.12 .venv

      - name: Install dependencies
        run: |
          # Pinned lock first (reproducible), then project + dev extras.
          uv pip install --python .venv/bin/python -r requirements.lock
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Dependency drift check (requirements.txt vs lock)
        run: |
          source .venv/bin/activate
          python scripts/check_dep_drift.py

      - name: Lint (ruff)
        run: source .venv/bin/activate && ruff check . --exit-non-zero-on-fix

      - name: Format check (ruff)
        run: source .venv/bin/activate && ruff format --check .

  typecheck:
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv + setup
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          ln -sf $HOME/.local/bin/uvx /usr/local/bin/uvx
          uv python install 3.12
          uv venv --allow-existing --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Type check (mypy)
        # Keep the production scope intact while adding only the Solana x402
        # transfer package as a focused typing ratchet. Run it separately
        # because it is nested under src/; overlapping paths cause duplicate modules.
        run: |
          source .venv/bin/activate
          mypy src/pry pry_mcp/ datasets/sports_data/derivatives/
          mypy src/pry/payments/x402/solana_transfer/
          mypy src/pry/commerce/reconciliation/
          mypy datasets/sports_data/parlay_legs/

  test:
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv + setup
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          ln -sf $HOME/.local/bin/uvx /usr/local/bin/uvx
          uv python install 3.12
          uv venv --allow-existing --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
          # The staged-package secret-scan test shells out to gitleaks; the
          # scanner fails open when the binary is missing (by design), so CI
          # installs it to exercise the real blocking path.
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
      - name: Test with coverage
        # ONE pass. The previous two-pass split (parallel with no coverage, then
        # a serial `-p no:xdist` coverage run) was correct about coverage not
        # parallelising, but it DOUBLED the wall clock: pass 1 measured 468s and
        # pass 2 needed ~1000s more on the same 2 cores, so the job was killed at
        # the 30-minute budget with every test already green.
        #
        # `-n 4 --cov` keeps coverage in ONE worker set. The original reason to
        # avoid it was memory: four workers each carrying a coverage model were
        # OOM-killed at 2.5GB. That limit is now 4GB per job with one job per
        # 2-core cpuset, which is exactly the headroom that argument assumed was
        # missing.
        #
        # `--cov-fail-under=76` is unchanged: the floor is the signal, not the
        # number of passes that produce it.
        #
        # NO `--randomly-seed` pin. The intermittency was a real fixture bug
        # (see `empty_scrape` in tests/conftest.py), not an order that needed
        # freezing -- pinning a seed would have pinned whichever order happened
        # to fail and hidden the cause. Randomised order is what surfaced it.
        run: source .venv/bin/activate && pytest tests/ --maxfail=10 -q --tb=short -n 4 --dist loadfile --timeout=120 --timeout-method=thread --cov=pry --cov-report=xml:coverage.xml --cov-fail-under=76 -m "not integration and not slow"
      # Publish the report so the diff-cover gate can CONSUME it instead of
      # re-running the whole suite for the same number. `test` is the only job
      # that executes the tests; everything downstream reads its output.
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v3
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 3
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: unittests
          name: pryscraper
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  integration-nightly:
    # Nightly (non-blocking): runs tests marked `integration` against a real
    # Postgres + Redis stack. The repo docker-compose.yml declares pry-redis /
    # pry-postgres volumes but no services, so this job spins up ephemeral
    # postgres:16 + redis:7 containers via the `services:` block. Deliberately
    # continue-on-error: infra flakiness must never block mainline CI.
    # Run locally with:  pytest -m integration  (requires PG+Redis reachable)
    if: github.event_name == 'schedule'
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pry
          POSTGRES_PASSWORD: pry
          POSTGRES_DB: pry
        # No host port mapping: the job container reaches the service via
        # its network alias (postgres:5432). Host mappings conflicted with
        # production containers (6379 = rmi-valkey) and broke service startup.
        options: >-
          --health-cmd "pg_isready -U pry -d pry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv + setup
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          ln -sf $HOME/.local/bin/uvx /usr/local/bin/uvx
          uv python install 3.12
          uv venv --allow-existing --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Run integration tests (Postgres + Redis)
        env:
          PRY_DATABASE_URL: postgresql+asyncpg://pry:pry@postgres:5432/pry
          PRY_REDIS_URL: redis://redis:6379/0
        # Nightly also runs the `slow` full-catalog tests (e.g. the 109-preset
        # actor staging gate) that are deselected from the default run.
        #
        # Advisory, NOT silent. A previous version chained `|| echo ...` AND
        # set continue-on-error, so a fully red nightly reported success. The
        # exit code is now captured and raised as a warning annotation; PRs stay
        # covered by the blocking `integration-gate` job below.
        run: |
          set +e
          source .venv/bin/activate
          pytest tests/ -m "integration or slow" -q --tb=short
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Nightly integration tests failed::pytest exited $rc (advisory run; PRs are gated by the blocking integration-gate job)"
          fi
          exit 0
        continue-on-error: true

  # The Docusaurus site is the public documentation home (docs.pryscraper.com)
  # but nothing in CI ever built it, so a broken MDX file, a bad relative link
  # (onBrokenLinks is "throw") or a dependency regression could land unnoticed.
  # This builds it on every PR and publishes the output as an artifact.
  docs:
    name: Docs site (Docusaurus)
    runs-on: docker-x64
    # NOT on the PR path (2026-11-21): cannot block a merge (its only run step
    # ends in `|| echo`/`|| true`) and is not a required context, so on a PR it
    # bought a runner slot and produced a result nobody gates on. Runs on main.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build documentation site
        working-directory: website
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          echo "Pages built: $(find build -name '*.html' | wc -l)"

      - name: Upload site artifact
        uses: actions/upload-artifact@v3
        with:
          name: docs-site
          path: website/build
          retention-days: 7

  # T1 win #4: Integration test gate on PRs (blocking). Spins up ephemeral
  # Postgres + Redis and runs the full integration suite. Blocks merge on
  # failure — no more "integration tests only run nightly" blind spot.
  integration-gate:
    name: Integration gate (Postgres + Redis)
    if: github.event_name == 'pull_request'
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pry
          POSTGRES_PASSWORD: pry
          POSTGRES_DB: pry
        # No host port mapping: the job container reaches the service via
        # its network alias (postgres:5432). Host mappings conflicted with
        # production containers (6379 = rmi-valkey) and broke service startup.
        options: >-
          --health-cmd "pg_isready -U pry -d pry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv + setup
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          ln -sf $HOME/.local/bin/uvx /usr/local/bin/uvx
          uv python install 3.12
          uv venv --allow-existing --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Run integration tests (blocking on PR)
        env:
          PRY_DATABASE_URL: postgresql+asyncpg://pry:pry@postgres:5432/pry
          PRY_REDIS_URL: redis://redis:6379/0
        run: source .venv/bin/activate && pytest tests/ -m integration -q --tb=short --timeout=120

  ladder-backtest:
    name: Scrape ladder backtest (vs baseline)
    # 25 ladder commits landed on 2026-09-29 with no CI reference to the
    # backtest, so a ladder change was graded only by whoever remembered to
    # run the script by hand. This job is that automation.
    #
    # ── Why it is ADVISORY, not blocking ─────────────────────────────────────
    # Evidence (not speculation):
    #   1. It needs a RUNNING Pry at PRY_URL. The harness POSTs to
    #      $PRY_URL/v1/scrape (scripts/backtest_ladder.py:104); the docstring
    #      states it "talks to a RUNNING Pry over HTTP with the owner key, so it
    #      measures the deployed system rather than the source tree" (line 16).
    #      A PR CI container has the source tree, not a deployment, and
    #      PRY_API_KEY is not available in PR context — the same constraint the
    #      k6-smoke job documents (line 553).
    #   2. Verified by running the script against a closed port
    #      (PRY_URL=http://127.0.0.1:9): success_rate 0.0, ok 0, all ten
    #      sources "detail=ConnectError", delta=-1.0 vs baseline 1.0 — and the
    #      script still exits 0. The unreachable case is INDISTINGUISHABLE from
    #      a total ladder regression by exit code alone.
    #   3. Therefore a blocking job here would report "PRY not deployed" as
    #      "the ladder is broken", training reviewers to click through it. The
    #      house precedent is the same: integration-nightly is continue-on-error
    #      with a ::warning annotation precisely so a red run is never silent.
    #
    # What would make this blocking: a Pry deployment reachable from CI at a
    # repo `vars.PRY_URL` + a secret owner key, PLUS the script writing the
    # per-run spread into the baseline (see the gate step) so the gate has a
    # tolerance to enforce. Both are outside this file's scope.
    #
    # ── Tolerance ────────────────────────────────────────────────────────────
    # The gate compares against baseline summary.success_rate (1.0) MINUS one
    # whole source (0.9). The documented evidence for that choice is the
    # script's own --repeat help: three warm runs of an UNCHANGED ladder gave
    # 0.875/0.875/1.0, so run-to-run swing is up to 0.125 (1.25 sources of 10).
    # 0.9 is therefore inside the observed noise band. The gate also ignores
    # "unavailable" probes entirely, because _rate() scores only results in
    # ("ok","fail") (line 204) — Pry being down must not read as a ladder fault.
    #
    # NOTE ON THE RECORDED SPREAD: scripts/backtest_ladder.py --compare reads
    # summary["success_rate_observed"] for a baseline min/median/max
    # (line 247), but _write_baseline persists only the keys present in
    # `summary`, and the summary dict (lines 216-226) never sets that key. The
    # committed data/ladder_baseline.json has no such block, so that print
    # branch is dead and the baseline records NO spread. This gate therefore
    # derives its own one-source tolerance rather than reading a spread that
    # does not exist. Fixing the baseline schema is a scripts/ + data/ change
    # and belongs to whichever lane owns those files.
    runs-on: docker-x64
    # ADVISORY ON MAIN ONLY (2026-11-21). Every step in this job ends in
    # `|| true`, so it cannot block a merge -- yet it held a runner slot on every
    # PR. With 6 pool slots and 35 jobs, those 10 advisory jobs were a third of
    # the queue, which is what starved other repos' PRs behind one repo's run.
    # They still run, on main/nightly, where a human reads the result.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv + setup
        # Same environment as the `test` / `integration-gate` jobs. httpx is a
        # runtime dependency in [project].dependencies (pyproject.toml:64), so
        # .[dev] is sufficient — no second environment, no extra install.
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          ln -sf $HOME/.local/bin/uvx /usr/local/bin/uvx
          uv python install 3.12
          uv venv --allow-existing --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Backtest the ladder against the committed baseline
        env:
          # Both are deployment facts, not repo facts. Without a deployed Pry
          # at PRY_URL this step measures nothing, so the gate below reports
          # "not configured" rather than a false regression.
          PRY_URL: ${{ vars.PRY_URL }}
          PRY_API_KEY: ${{ secrets.PRY_API_KEY }}
          LADDER_SOURCE_COUNT: '10'
          # One whole source of tolerance. See the tolerance note above.
          LADDER_MIN_SUCCESS_RATE: '0.9'
        # The script's own exit code is 0 on EVERY outcome, including a
        # 10/10 ConnectError sweep, so `--compare` alone gates nothing. The
        # real gate is the `Ladder gate` step that follows.
        continue-on-error: true
        run: |
          set +e
          source .venv/bin/activate
          if [ -z "$PRY_URL" ]; then
            echo "::warning title=Ladder backtest not configured::PRY_URL is unset; skipping the network path entirely"
            echo "SKIPPED_NO_PRY_URL" > /tmp/ladder-result.txt
            exit 0
          fi
          echo "== backtesting scrape ladder against data/ladder_baseline.json =="
          # Single network run. The gate step below reads this capture; the
          # backtest is NOT run twice.
          python scripts/backtest_ladder.py --compare --timeout 60 --repeat 3 \
            2>&1 | tee /tmp/ladder-backtest.txt
          rc=${PIPESTATUS[0]}
          cp /tmp/ladder-backtest.txt /tmp/ladder-result.txt || true
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Ladder backtest errored::backtest_ladder.py exited $rc (advisory; gate below evaluates the result)"
          fi
          exit 0

      - name: Ladder gate (success_rate vs baseline)
        # The actual gate. Mirrors the mutation score gate's shape: a python
        # heredoc that exits non-zero with a stated reason, so the failure
        # message names the numbers rather than a bare code.
        continue-on-error: true
        run: |
          source .venv/bin/activate
          python - <<'PY'
          import json, os, sys

          BASELINE = "data/ladder_baseline.json"
          MIN_RATE = float(os.environ.get("LADDER_MIN_SUCCESS_RATE", "0.9"))
          SOURCES = int(os.environ.get("LADDER_SOURCE_COUNT", "10"))

          # 1. Unconfigured deployment: not a verdict. Advisory job, so this is
          #    a warning and a clean exit, never a fabricated pass or fail.
          if not os.environ.get("PRY_URL", "").strip():
              print("::warning title=Ladder backtest not run::PRY_URL unset — no deployed Pry to measure. "
                    "Set the PRY_URL repo variable to enable this gate.")
              print("STATUS=not_configured")
              sys.exit(0)

          # 2. Read the single run captured by the previous step — this gate
          #    must not issue its own network calls.
          try:
              out = open("/tmp/ladder-result.txt").read()
          except OSError as exc:
              print(f"::warning title=Ladder backtest output missing::{exc}")
              print("STATUS=no_output")
              sys.exit(0)

          # 3. The script prints no machine-readable summary, so parse the one
          #    line that is unambiguous. --compare emits, per key:
          #      "  success_rate   baseline=1.0  now=0.875  delta=-0.125"
          #    so `now=` is the value observed THIS run and `baseline=` is the
          #    committed file. Matching on "=" alone would read baseline=1.0
          #    and the gate would compare the baseline against itself forever.
          def _now(name: str) -> float | None:
              for line in out.splitlines():
                  s = line.strip()
                  if not s.startswith(name):
                      continue
                  for token in s.split():
                      if token.startswith("now="):
                          try:
                              return float(token[4:])
                          except ValueError:
                              return None
              return None

          now = _now("success_rate")
          if now is None:
              print("::warning title=Ladder backtest unparseable::no 'now=' success_rate in output; skipping gate")
              print("STATUS=unparseable")
              sys.exit(0)

          # 4. All-unavailable is the "Pry not deployed / network dead" signature.
          #    ok==0 is not a ladder regression, it is a missing deployment.
          #    Verified: a closed PRY_URL yields ok=0 with all ten ConnectError.
          ok_now = _now("ok")
          if ok_now == 0:
              print("::warning title=Ladder backtest inconclusive::0/10 sources reached Pry — "
                    "deployment unreachable, not a ladder regression")
              print("STATUS=inconclusive")
              sys.exit(0)

          try:
              base = json.loads(open(BASELINE).read())["summary"]
          except (OSError, KeyError, ValueError) as exc:
              print(f"::warning title=Ladder baseline unreadable::{exc}")
              print("STATUS=no_baseline")
              sys.exit(0)

          base_rate = base.get("success_rate")
          if base_rate is None:
              print("::warning title=Ladder baseline has no success_rate::cannot gate")
              print("STATUS=no_baseline")
              sys.exit(0)

          floor = round(float(base_rate) - (1.0 / SOURCES), 3)
          floor = min(floor, MIN_RATE)   # the tighter of the two wins
          print(f"ladder success_rate: {now}  baseline: {base_rate}  floor: {floor}")
          if now < floor:
              print(f"::error title=Ladder regression::success_rate {now} < floor {floor} "
                    f"(baseline {base_rate} minus one source of {SOURCES})")
              print("STATUS=regression")
              sys.exit(0)   # advisory job: report loudly, do not block
          print("STATUS=ok")
          PY

      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: ladder-backtest-report
          path: |
            /tmp/ladder-result.txt
          retention-days: 7
        continue-on-error: true

  # crucible-gate REMOVED (audit 2026-09-11 P1): duplicated the dedicated
  # `mutation-test` job below, and its mutmut fallback (--paths-to-mutate .)
  # would have mutated the entire repo including tests. The scoped
  # `mutation-test` job (engine-core baseline, 60% gate) is the single gate.

  secrets:
    name: Secret scan (gitleaks)
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          apt-get update && apt-get install -y --no-install-recommends wget git ca-certificates && rm -rf /var/lib/apt/lists/*
          wget -qO- https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          # SCAN THE COMMIT UNDER TEST, NOT EVERY REF ON THE SERVER (2026-11-21).
          #
          # `gitleaks detect --source .` with no --log-opts walks EVERY ref it can
          # see. Checkout fetches all branches (fetch-depth: 0), so on this repo
          # that is 1,886 refs -- including abandoned lanes whose old commits
          # predate the current .gitleaks.toml and still trip it. The gate then
          # failed a PR for a secret nobody can fix: it lives in history the PR
          # does not contain and will never be merged.
          #
          # Measured: 19 findings on 7 commits, and `git merge-base --is-ancestor
          # <commit> origin/main` was FALSE for every one. Scoped to origin/main
          # the same scan reports ZERO. The rule stays fully active over the
          # history that actually ships.
          #
          # --log-opts keeps full-history coverage of the branch under test (a
          # secret added and later removed inside a PR is still caught).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect --source . --no-banner --exit-code 1 --config .gitleaks.toml \
              --log-opts="origin/${{ github.base_ref }}..HEAD"
          else
            gitleaks detect --source . --no-banner --exit-code 1 --config .gitleaks.toml \
              --log-opts="origin/${GITHUB_REF_NAME}"
          fi

  security:
    name: Security audit (bandit)
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv + setup
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          ln -sf $HOME/.local/bin/uvx /usr/local/bin/uvx
          uv python install 3.12
          uv venv --python 3.12 /tmp/bandit-venv
          uv pip install --python /tmp/bandit-venv/bin/python bandit
      - name: Bandit (high+medium severity)
        run: source /tmp/bandit-venv/bin/activate && bandit -r . -x './tests/*,./.venv/*,./__pycache__/*' -ll -f json -o bandit-report.json
      - name: Upload report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json
        if: always()

  shellcheck:
    # Audit 2026-09-12: was localhost/ci-alpine-node:3.19 — custom images get
    # pruned by fleet cleanup and the runner then fails to pull them (404).
    # Use the cached standard image + distro shellcheck instead.
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned shellcheck 0.11.0
        # PINNED STATIC BINARY - never `apt-get install shellcheck`. The distro
        # package resolves to whatever the runner image ships (0.8/0.9 on jammy,
        # 0.10 on bookworm, whatever python-nodejs carries) while the Talos
        # pre-commit hook runs 0.11.0. Same script, different rule set, so a push
        # that was clean locally failed CI. The version gate below is part of the
        # step: a silent fallback to another release fails the job.
        run: |
          set -euo pipefail
          SC_VERSION=0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SC_VERSION}/shellcheck-v${SC_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp "shellcheck-v${SC_VERSION}/shellcheck"
          if [ -w /usr/local/bin ]; then
            dest=/usr/local/bin
          else
            dest="$HOME/.local/bin"; mkdir -p "$dest"; echo "$dest" >> "$GITHUB_PATH"
          fi
          install -m 0755 "/tmp/shellcheck-v${SC_VERSION}/shellcheck" "$dest/shellcheck"
          "$dest/shellcheck" --version | grep -qx "version: $SC_VERSION" \
            || { echo "FATAL: pinned shellcheck $SC_VERSION not installed"; exit 1; }
          "$dest/shellcheck" --version | head -2
      - name: ShellCheck all shell scripts
        # Default (style) severity - identical to the pre-commit hook - on the
        # same pinned 0.11.0 binary. `-type f` is required: a directory whose name
        # ends in .sh (acme.sh-style) makes shellcheck abort.
        run: |
          find . -type f -name "*.sh" -not -path "*/node_modules/*" -not -path "*/.venv/*" -not -path "*/sdks/*" -exec shellcheck -x {} +

  docker-lock-drift:
    name: docker lock drift check
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Regenerate requirements.docker.lock and fail on drift
        run: |
          python3 scripts/gen-docker-lock.py
          if ! git diff --exit-code requirements.docker.lock; then
            echo "❌ requirements.docker.lock is stale vs requirements.lock."
            echo "   Run: python3 scripts/gen-docker-lock.py && commit the result."
            exit 1
          fi
          echo "✅ requirements.docker.lock in sync with requirements.lock"


  hadolint:
    name: Hadolint (Dockerfile lint)
    runs-on: docker-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run hadolint on Dockerfile (blocking on ERROR)
        # Audit 2026-09-12: was `docker run` inside the job container, which
        # has no docker CLI → "docker: command not found". Use the static
        # hadolint binary instead (no docker dependency).
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -sSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint --config .hadolint.yaml --failure-threshold error Dockerfile

  trivy-scan:
    # BLOCKING on CRITICAL since 2026-10-18 (was advisory). Rationale and the
    # allowlist policy live in docs/ops/SECURITY-GATES.md.
    #
    # Audit 2026-09-12: was aquasecurity/trivy-action@0.28.0 + `docker build`
    # — the runner could not resolve the action ref, and job containers have
    # no docker CLI (same class as hadolint/sign-image). Rewritten to scan
    # the filesystem + configs with the trivy static binary.
    #
    # Split deliberately: the vulnerability/secret/config scanners each carry
    # only `--severity CRITICAL`, so HIGH findings cannot quietly ride along
    # with a blocking gate. A CRITICAL that is genuinely unfixable goes into
    # docs/ops/trivy-ignore.yaml WITH an expiry — never a blanket
    # continue-on-error.
    runs-on: docker-x64
    timeout-minutes: 30
    needs: test
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Trivy
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -sSL -o /tmp/trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy --version
      - name: Trivy vulnerability scan (CRITICAL — blocking)
        # Scans the repo's dependency manifests/lockfiles, not an image: the
        # job container has no docker CLI. Image-layer CVEs are caught by the
        # same gate when a docker-capable runner builds the image.
        # `--skip-dirs` keeps vendored copies and the docs site out of scope;
        # the shipped lockfiles (requirements.docker.lock) are in scope.
        run: |
          trivy fs --scanners vuln --severity CRITICAL --exit-code 1 \
            --ignorefile docs/ops/trivy-ignore.yaml \
            --skip-dirs .git --skip-dirs .venv --skip-dirs node_modules \
            --skip-dirs website --skip-dirs tests --skip-dirs datasets \
            --format sarif --output trivy-results.sarif .
      - name: Trivy secret scan (CRITICAL — blocking)
        # Gitleaks (blocking, tests included) is the primary secret gate; this
        # is the second independent scanner. Test fixtures are skipped here
        # because gitleaks already covers them with its own allowlist.
        run: |
          trivy fs --scanners secret --severity CRITICAL --exit-code 1 \
            --skip-dirs .git --skip-dirs .venv --skip-dirs node_modules \
            --skip-dirs website --skip-dirs tests --skip-dirs datasets \
            --format sarif --output trivy-secrets.sarif .
      - name: Trivy config scan (Dockerfile, compose — CRITICAL blocking)
        run: |
          trivy config --severity CRITICAL --exit-code 1 \
            --ignorefile docs/ops/trivy-ignore.yaml \
            --format sarif --output trivy-config.sarif .
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: trivy-results
          path: trivy-*.sarif

  pip-audit:
    runs-on: docker-x64
    # ADVISORY ON MAIN ONLY (2026-11-21). Every step in this job ends in
    # `|| true`, so it cannot block a merge -- yet it held a runner slot on every
    # PR. With 6 pool slots and 35 jobs, those 10 advisory jobs were a third of
    # the queue, which is what starved other repos' PRs behind one repo's run.
    # They still run, on main/nightly, where a human reads the result.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    needs: test
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pip-audit + deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc git ca-certificates curl
          rm -rf /var/lib/apt/lists/*
          pip install pip-audit
          pip install -r requirements.txt 2>/dev/null || true
      - name: Run pip-audit (blocking on any advisory)
        # Audit 2026-09-12: pip-audit has no --fail-on flag (unrecognized
        # argument). It exits 1 on any finding; requirements.txt is clean
        # today (verified locally), so this blocks future vulns outright.
        run: |
          pip-audit --desc 2>&1 || { echo "❌ pip-audit found vulnerabilities — fix before merge"; exit 1; }

  deps-freshness:
    runs-on: docker-x64
    # ADVISORY ON MAIN ONLY (2026-11-21). Every step in this job ends in
    # `|| true`, so it cannot block a merge -- yet it held a runner slot on every
    # PR. With 6 pool slots and 35 jobs, those 10 advisory jobs were a third of
    # the queue, which is what starved other repos' PRs behind one repo's run.
    # They still run, on main/nightly, where a human reads the result.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check dependency freshness
        run: |
          pip install libyear 2>/dev/null || true
          if [ -f requirements.txt ]; then
            pip install pip-tools && libyear --file requirements.txt || echo "Dep freshness check noted"
          fi
        continue-on-error: true

  k6-smoke:
    # k6 needs a RUNNING pryscraper service to test against. In PR CI the
    # Docker Compose stack (pryscraper + FlareSolverr) would need to be built
    # and started, and secrets (PRY_API_KEY, etc.) are not available in PR
    # context. Runs on schedule against the live deployment instead.
    # To enable: set K6_TARGET_URL as a repo variable (vars) or secret
    # pointing to the deployed service (set as a repository variable).
    if: github.event_name == 'schedule'
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      # Standard python+node image: actions/checkout is a node action and
      # cannot run inside grafana/k6 (no node -> exitcode 127). k6 itself
      # is installed below from the official static binary (v2.2.0).
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install k6
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -sSL -o /tmp/k6.tar.gz \
            https://github.com/grafana/k6/releases/download/v2.2.0/k6-v2.2.0-linux-amd64.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          mv /tmp/k6-v2.2.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version
      - name: Create results directory
        run: mkdir -p tests/k6/results
      - name: Run k6 smoke test against live deployment
        run: |
          # Default target is the public production API (verified live
          # 2026-09-11). Override per-deployment via the K6_TARGET_URL repo
          # variable — never a placeholder domain (audit P0.9: the old
          # https://pry.example.com default guaranteed this job failed).
          k6 run tests/k6/smoke.js \
            -e BASE_URL=${{ vars.K6_TARGET_URL || 'https://api.pryscraper.com' }} \
            --summary-export=tests/k6/results/smoke-summary.json
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: k6-smoke-report
          path: tests/k6/results/

  fuzz:
    runs-on: docker-x64
    # ADVISORY ON MAIN ONLY (2026-11-21). Every step in this job ends in
    # `|| true`, so it cannot block a merge -- yet it held a runner slot on every
    # PR. With 6 pool slots and 35 jobs, those 10 advisory jobs were a third of
    # the queue, which is what starved other repos' PRs behind one repo's run.
    # They still run, on main/nightly, where a human reads the result.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    needs: test
    steps:
      - name: Install Node.js + deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates gcc libpq-dev git
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup uv + deps
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          uv python install 3.12 && uv venv --allow-existing --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]" hypothesis
      - name: Run fuzz tests
        run: |
          source .venv/bin/activate
          HYPOTHESIS_PROFILE=ci python -m pytest tests/fuzz/ -v --tb=short || echo "Fuzz tests noted (non-blocking)"
        continue-on-error: true
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: fuzz-results
          path: .hypothesis/
          include-hidden-files: true

  contract-test:
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    needs: test
    steps:
      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates gcc git
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup uv + deps
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          uv python install 3.12 && uv venv --allow-existing --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]" pact-python
      - name: Run consumer contract tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/contract/ -v --tb=short
      - name: Upload pact files
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: pacts
          path: tests/contract/pacts/

  sbom:
    # Audit 2026-09-12: anchore/sbom-action uses node24 — Forgejo runner
    # v9.0.0 supports node20 max ("runs.using key ... got node24"). Replaced
    # with a direct syft install + generation (same artifact contract).
    runs-on: docker-x64
    timeout-minutes: 30
    needs: [test, typecheck]
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Syft
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM (CycloneDX)
        run: syft dir:. -o cyclonedx-json=sbom.spdx.json
      - name: Verify SBOM (blocking — bad SBOM = broken build)
        run: |
          if [ -f sbom.spdx.json ]; then
            bash scripts/sbom-verify.sh sbom.spdx.json
          else
            echo "❌ SBOM file not generated"
            exit 1
          fi
      - uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: sbom.spdx.json

  ocr-review:
    runs-on: docker-x64
    # NOT on the PR path (2026-11-21): cannot block a merge (its only run step
    # ends in `|| echo`/`|| true`) and is not a required context, so on a PR it
    # bought a runner slot and produced a result nobody gates on. Runs on main.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install Open Code Review
        run: npm install -g @alibaba-group/open-code-review@latest || echo "OCR install skipped (will retry next run)"
        continue-on-error: true
      - name: Configure OCR
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
        run: |
          if command -v ocr &>/dev/null; then
            ocr config set llm.url "$OCR_LLM_URL"
            ocr config set llm.auth_token "$OCR_LLM_AUTH_TOKEN"
            ocr config set llm.model "$OCR_LLM_MODEL"
            ocr config set llm.use_anthropic false
            ocr config set llm.extra_body '{"thinking": {"type": "disabled"}}'
            ocr config set language English
          else
            echo "OCR not installed — skipping config"
          fi
        continue-on-error: true
      - name: Run OCR code review
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
        run: |
          if command -v ocr &>/dev/null; then
            TARGET_BRANCH="${GITHUB_BASE_REF:-main}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            if [ -n "$HEAD_SHA" ]; then
              git fetch origin "$TARGET_BRANCH" 2>/dev/null || true
              ocr review \
                --from "origin/$TARGET_BRANCH" \
                --to "$HEAD_SHA" \
                --format json \
                > /tmp/ocr-result.json 2>/tmp/ocr-stderr.log || echo "OCR review completed with findings"
              echo "=== OCR result ==="
              cat /tmp/ocr-result.json
            else
              echo "Not a PR event — skipping review"
            fi
          else
            echo "OCR not installed — skipping (non-blocking)"
          fi
        continue-on-error: true
      - name: Upload OCR report
        uses: actions/upload-artifact@v3
        with:
          name: ocr-review-report
          path: |
            /tmp/ocr-result.json
            /tmp/ocr-stderr.log
        continue-on-error: true

  archfit:
    # Audit 2026-09-12: was localhost/ci-golang-node:1.22 (pruned custom image
    # → runner pull 404). Runs on the standard image; installs Go only if the
    # distro provides it and degrades to a skip otherwise (advisory job).
    runs-on: docker-x64
    # ADVISORY ON MAIN ONLY (2026-11-21). Every step in this job ends in
    # `|| true`, so it cannot block a merge -- yet it held a runner slot on every
    # PR. With 6 pool slots and 35 jobs, those 10 advisory jobs were a third of
    # the queue, which is what starved other repos' PRs behind one repo's run.
    # They still run, on main/nightly, where a human reads the result.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Go + archfit (best effort)
        run: |
          apt-get update && apt-get install -y --no-install-recommends golang-go ca-certificates
          rm -rf /var/lib/apt/lists/*
          export GOPATH="$HOME/go" PATH="$PATH:$HOME/go/bin"
          go install github.com/alexei-led/archfit/cmd/archfit@latest || echo "archfit install skipped"
        continue-on-error: true
      - name: Run architecture fitness check
        run: |
          export PATH="$PATH:$HOME/go/bin"
          if command -v archfit &>/dev/null; then
            archfit analyze
          else
            echo "archfit not installed — skipping (non-blocking)"
          fi

  # ── ENTERPRISE QUALITY GATES (2026-08-27) ─────────────────────
  mutation-test:
    name: Mutation testing (mutmut)
    runs-on: docker-x64
    # ADVISORY ON MAIN ONLY (2026-11-21). Every step in this job ends in
    # `|| true`, so it cannot block a merge -- yet it held a runner slot on every
    # PR. With 6 pool slots and 35 jobs, those 10 advisory jobs were a third of
    # the queue, which is what starved other repos' PRs behind one repo's run.
    # They still run, on main/nightly, where a human reads the result.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv + setup
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          uv python install 3.12
          uv venv --allow-existing --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Run mutation tests (targeted)
        run: |
          source .venv/bin/activate
          # Scoped to the engine-core mutation baseline (MUTATION_BASELINE.md).
          # mutmut 3.x reads scope from [tool.mutmut] in pyproject.toml — no CLI flags.
          mutmut run --max-children 8
          mutmut results > mutmut-report.txt 2>&1 || true
          mutmut export-cicd-stats
          echo "=== Mutation test results ==="
          cat mutmut-report.txt
      - name: Mutation score gate (fail below baseline)
        run: |
          source .venv/bin/activate
          python - <<'PY'
          import json, sys

          BASELINE = 60.0  # keep in sync with MUTATION_BASELINE.md

          try:
              data = json.loads(open("mutants/mutmut-cicd-stats.json").read())
          except (OSError, json.JSONDecodeError):
              sys.exit("mutation gate: mutants/mutmut-cicd-stats.json missing or invalid — run `mutmut export-cicd-stats` first")

          killed = data.get("killed", 0)
          total = data.get("total", 0)
          no_tests = data.get("no_tests", 0)
          skipped = data.get("skipped", 0)
          evaluated = total - no_tests - skipped
          if evaluated <= 0:
              sys.exit("mutation gate: no mutants evaluated — check [tool.mutmut] config")
          score = 100.0 * killed / evaluated
          print(f"mutation score: {score:.1f}% ({killed}/{evaluated} evaluated of {total}) — baseline {BASELINE}%")
          if score < BASELINE:
              sys.exit(f"mutation gate FAILED: {score:.1f}% < baseline {BASELINE}%")
          PY
        # Report upload stays non-blocking; the gate above is the blocking step.
      - name: Upload report
        uses: actions/upload-artifact@v3
        with:
          name: mutmut-report
          path: mutmut-report.txt
        continue-on-error: true

  complexity-gate:
    name: Code complexity (radon + xenon)
    runs-on: docker-x64
    # ADVISORY ON MAIN ONLY (2026-11-21). Every step in this job ends in
    # `|| true`, so it cannot block a merge -- yet it held a runner slot on every
    # PR. With 6 pool slots and 35 jobs, those 10 advisory jobs were a third of
    # the queue, which is what starved other repos' PRs behind one repo's run.
    # They still run, on main/nightly, where a human reads the result.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install tools
        run: pip install radon xenon
      - name: Complexity check (radon)
        run: |
          echo "=== Cyclomatic complexity (A-E grades) ==="
          radon cc src/ -a -nc --min=B || echo "WARN: complexity below B grade found"
      - name: Xenon complexity gate (ratcheted thresholds)
        # Audit 2026-09-11 P0.7: the old B/A/A gate sat at 266 violations and
        # had never passed — it gated nothing. First ratchet F/F/A (green).
        # Ratchet 2 (2026-09-12): the last 4 F-rank blocks were refactored
        # (solana_transfer.verify_solana_payment F54->C11,
        # evm_verify.EVMVerifyMixin.verify F42->C17, cli_commands.main
        # F41->C11, scraper_orchestrate._scrape_with_fallbacks F46->C20) —
        # Ratchet 3 (2026-09-12): the last 4 E-rank blocks refactored
        # (form_detection.classify_role E37, automator.run_steps E33,
        # config_validation.validate_config E31, middleware_http._handle_http
        # E31) — threshold tightened to D/C/A. 18 D-rank blocks remain;
        # next targets. Then C/C/A.
        run: |
          xenon --max-absolute D --max-modules C --max-average A src/ || {
            echo "❌ Complexity gate failed: block exceeded D rank, module exceeded C, or repo average slipped"
            exit 1
          }

  dead-code-gate:
    name: Dead code detection (vulture)
    runs-on: docker-x64
    # ADVISORY ON MAIN ONLY (2026-11-21). Every step in this job ends in
    # `|| true`, so it cannot block a merge -- yet it held a runner slot on every
    # PR. With 6 pool slots and 35 jobs, those 10 advisory jobs were a third of
    # the queue, which is what starved other repos' PRs behind one repo's run.
    # They still run, on main/nightly, where a human reads the result.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install vulture
        run: pip install vulture
      - name: Dead code scan (min 80% confidence)
        run: |
          vulture src/ --min-confidence 80 > vulture-report.txt 2>&1 || true
          echo "=== Dead code report ==="
          cat vulture-report.txt
          if grep -q "unused" vulture-report.txt; then
            echo "⚠️ Dead code found — review and remove"
          fi

  docstring-gate:
    name: Docstring coverage (interrogate)
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install interrogate
        run: pip install interrogate
      - name: Docstring coverage check (min 60%)
        run: |
          interrogate src/ --verbose --fail-under 60 --generate-badge /tmp/interrogate-badge.svg || {
            echo "❌ Docstring coverage below 60%"
            exit 1
          }

  # security-dependency-gate REMOVED (audit 2026-09-11 P1): duplicated the
  # `pip-audit` job above, but audited the ambient container environment
  # (no requirements install) rather than the project's pinned deps — noise,
  # not signal. The `pip-audit` job (requirements.txt, blocking on
  # HIGH/CRITICAL) is the single dependency-security gate.

  coverage-regression-gate:
    # WAS: a second full `pytest` run purely to produce coverage.xml for
    # diff-cover -- same suite, same runner pool, ~11 minutes, for a number the
    # `test` job had already computed. It now CONSUMES test's artifact instead.
    # The delta check it performs (lines changed in this PR vs main) is unique and
    # is kept; only the duplicate execution is gone.
    name: Coverage regression (diff-cover)
    if: github.event_name == 'pull_request'
    needs: [test]
    runs-on: docker-x64
    timeout-minutes: 10
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Download coverage from the test job
        uses: actions/download-artifact@v3
        with:
          name: coverage-xml
      - name: Coverage regression check
        run: |
          python3 -m pip install --quiet diff-cover
          diff-cover coverage.xml --compare-branch=origin/main --fail-under=75 || {
            echo "coverage regression: changed lines below 75% or dropped vs main"
            exit 1
          }

  supply-chain:
    runs-on: docker-x64
    # ADVISORY ON MAIN ONLY (2026-11-21). Every step in this job ends in
    # `|| true`, so it cannot block a merge -- yet it held a runner slot on every
    # PR. With 6 pool slots and 35 jobs, those 10 advisory jobs were a third of
    # the queue, which is what starved other repos' PRs behind one repo's run.
    # They still run, on main/nightly, where a human reads the result.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install scanners
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl git ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner && chmod +x /usr/local/bin/osv-scanner
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.0/trufflehog_3.97.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin trufflehog
      - name: OSV dependency scan (lockfile, CRITICAL/HIGH gate)
        run: |
          # osv-scanner's exit code means "vulnerabilities found" (1), NOT
          # "the scan failed". Swallowing it with `|| true` also swallowed a
          # genuine scanner crash, which is why this was flagged as a
          # neutralised gate: a scan that never ran produced an empty osv.json
          # and the gate script then passed it.
          # Handle the two cases distinctly -- a real failure must fail.
          set +e
          osv-scanner --lockfile=uv.lock --format=json > osv.json
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "osv-scanner failed to scan (exit $rc); this is not a finding"
            exit "$rc"
          fi
          python3 .forgejo/scripts/osv_gate.py osv.json
      - name: Trufflehog verified-live secrets (all history)
        run: trufflehog git file://. --only-verified --fail --no-update

  nightly-deep-scan:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Noseyparker full-history secret hunt
        run: |
          curl -sSfL https://github.com/praetorian-inc/noseyparker/releases/download/v0.24.0/noseyparker-v0.24.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker scan --git-history-format all . || true
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker report || true
      - name: Grype vulnerability match on working tree
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype dir:. --fail-on critical || echo "::warning::critical vulns in tree"

  # ── Changelog (git-cliff) ─────────────────────────────────────
  # Verify a changelog can be generated from conventional commits.
  # Runs in the ephemeral CI workspace, so the committed CHANGELOG.md
  # is never clobbered.
  changelog:
    runs-on: docker-x64
    timeout-minutes: 30
    needs: [lint]
    container:
      # Audit 2026-09-12: default node image has no pip ('pip: command not
      # found') — run on the standard python+node image.
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install git-cliff
        run: pip install git-cliff
      - name: Verify changelog generation
        run: git-cliff --strip header -o CHANGELOG.md

  structure-gate:
    # Fleet coding gates (synced from standards/fleet/scripts via
    # fleet-sync-gates.sh): structure ≤200-line cap (shrink-only ratchet,
    # baseline scripts/structure-baseline.json), monkeypatch ratchet
    # (scripts/monkeypatch-baseline.json), antipattern ratchet
    # (scripts/antipattern-baseline.json), the package-discovery gate that
    # keeps [tool.setuptools.packages.find].include equal to the real package
    # set under src/ in both directions, and the gate self-test that
    # proves every gate catches its violation class. Shrink freely; growth
    # or NEW offenders fail the build. Regenerate deliberately:
    # --update-baseline.
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The CLAIMS gate below imports the REAL application modules
      # (`pry.payments.x402...`, `pry_mcp.tools`) to read the tool count, prices
      # and supported chains. This job used to install nothing, so that gate
      # died with `ModuleNotFoundError: No module named 'httpx'` after ~37s and
      # the whole required check went red — on main as well as on branches. The
      # other six gates are stdlib-only and unaffected; installing the runtime
      # deps is what makes the seventh able to run at all.
      - name: Install runtime deps (needed by the claims gate)
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev \
            && rm -rf /var/lib/apt/lists/*
          # Use the IMAGE's interpreter, not a uv-managed download. `uv venv
          # --python 3.11` provisions a managed CPython from the network, which
          # is a second failure mode in a job whose contract is "run seven
          # static gates". The image already ships Python 3.11.17.
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet -e .
      - name: Structure gate (≤200-line cap, shrink-only)
        run: python3 scripts/check-structure.py --repo . --scan-root src/pry --scan-root src/pry/payments/x402/solana_transfer/ --scan-root src/pry/commerce/reconciliation/ --scan-root tests --scan-root scripts --scan-root datasets/sports_data/derivatives --scan-root datasets/sports_data/parlay_legs/
      - name: Monkeypatch gate (per-repo ratchet)
        run: python3 scripts/check-monkeypatch.py --repo .
      - name: Antipattern gate (per-repo ratchet)
        run: python3 scripts/check-antipatterns.py --repo .
      - name: Package-discovery gate (include list == real packages, both directions)
        run: python3 scripts/check-package-discovery.py --repo .
      - name: Gate self-test (every gate catches its violation class)
        run: bash scripts/ci-gate-selftest.sh
      - name: Test-integrity gate (no NEW tautological tests)
        run: python3 scripts/check-test-integrity.py --repo . --baseline tests/integrity-baseline.json
      - name: Claims gate (tool count, prices, chains, licence)
        run: .venv/bin/python scripts/check-claims.py

  wheel-smoke:
    # Packaging regression gate (P0, 2026-10-18): the wheel shipped ZERO files
    # for the seven root-level runtime packages (pry_mcp, extraction, compliance,
    # site_catalog, datasets, actor_factory, crypto_market) because
    # packages.find scanned only src/. The installed `pry serve` / `pry-mcp`
    # binaries died on ModuleNotFoundError. This job builds the real wheel,
    # asserts >=1 member per required package and no tests/, installs it into a
    # clean venv, then boots both entry points from a non-repo cwd.
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
      - name: Install runtime deps (the entry points import them)
        # RUNTIME-ONLY LOCK, NOT THE FLATTENED ONE (2026-11-21).
        #
        # `requirements.txt` is `uv export --all-extras --all-groups`, which
        # flattens the dev extra into the same list as the runtime deps. The dev
        # extra carries `semgrep`, and semgrep 1.182.1 hard-pins `mcp==1.29.0`
        # while this project requires `mcp` 2.x. In `uv.lock` those are two
        # separate resolution sub-trees and both can exist; in a FLATTENED
        # requirements file they cannot, so pip fails before installing anything:
        #
        #   ERROR: Cannot install -r requirements.txt (line 859) and mcp==2.3.0
        #     The user requested mcp==2.3.0
        #     semgrep 1.182.1 depends on mcp==1.29.0
        #   ERROR: ResolutionImpossible
        #
        # This job builds a WHEEL and boots its entry points; it needs runtime
        # deps and nothing else. `--no-dev --no-default-groups` exports exactly
        # that and resolves cleanly (verified: installs mcp 2.3.0, semgrep
        # absent). `--no-emit-project` stays as before so the wheel is the only
        # artefact under test.
        # USE `uv pip`, NOT `pip` (2026-11-21). MEASURED on the same
        # requirements file: `pip install` 322s, `uv pip install` 2s. The step has
        # a ~5 minute budget inside the job's own timeout, so pip was killed at
        # 287s mid-install and the job then failed in its teardown path --
        # reported as a container-removal race, which was a symptom.
        #
        # `uv` is already installed by the step above, so this removes a
        # dependency rather than adding one: no new tool, no cache config, just
        # the resolver that is already in the image.
        run: |
          uv export --frozen --no-hashes --no-emit-project \
            --no-dev --no-default-groups -o /tmp/requirements-runtime.txt
          uv pip install --system -r /tmp/requirements-runtime.txt
      - name: Build + install wheel, assert membership and entry points
        run: bash scripts/smoke-wheel.sh

  # Guardian — dangerous-diff gate (required). Fails a PR that deletes tests,
  # edits CI config while deleting tests, adds shell/exec or dynamic eval, or
  # exceeds the scope budget. The policy is pinned in scripts/guardian_scan.py
  # and read from the BASE branch, never from the diff under review, so the
  # gate cannot be relaxed by the change it judges. Blocks on push and PR.
  guardian:
    name: Guardian (dangerous-diff)
    runs-on: docker-x64
    # ADVISORY ON MAIN ONLY (2026-11-21). Every step in this job ends in
    # `|| true`, so it cannot block a merge -- yet it held a runner slot on every
    # PR. With 6 pool slots and 35 jobs, those 10 advisory jobs were a third of
    # the queue, which is what starved other repos' PRs behind one repo's run.
    # They still run, on main/nightly, where a human reads the result.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan the staged/PR diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}" || true
            git diff --no-color "origin/${{ github.base_ref }}...HEAD" > /tmp/guardian.diff
          else
            git diff --no-color HEAD~1..HEAD > /tmp/guardian.diff
          fi
          python3 scripts/check-guardian.py --diff /tmp/guardian.diff

  # ===================================================================
  # GATE: commitlint (conventional commits)
  # ===================================================================
  commitlint:
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Validate commits
        run: |
          # A MERGE COMMIT IS NOT A COMMIT SUBJECT (2026-11-21).
          #
          # On push this ran `commitlint --from=HEAD~1 --to=HEAD`, which on a
          # merged PR is the MERGE COMMIT -- and Forgejo writes that subject
          # itself as `Merge pull request '<PR title>' (#N) from <branch> into
          # main`. That string can never satisfy config-conventional: it is not
          # a type, and the PR title inside it is prose. The gate therefore
          # failed on the forge's own message while every commit it wrapped was
          # fine, e.g.
          #     ✖ subject must not be sentence-case [subject-case]
          #     input: Merge pull request 'docs: SESSION-TODO reflects the true
          #            final state' (#103) from docs/session-closeout into main
          # Skipping merge commits lints exactly what a human wrote. `--no-merges`
          # is the narrowing (GATING.md move 2): a bad subject on a real commit
          # still fails.
          #
          # PR titles remain prose-and-capitalised on purpose: Forgejo uses the
          # title as the merge-commit subject, and release notes read them.
          # commitlint has NO --no-merges flag (it is a `git log` option), so the
          # merge filtering has to happen in git. On push this previously ran
          # `--from=HEAD~1 --to=HEAD`, which on a merged PR is the merge commit --
          # and Forgejo writes that subject itself:
          #     Merge pull request 'docs: SESSION-TODO reflects the true final state'
          #     (#103) from docs/session-closeout into main
          # No rewrite of that string can satisfy config-conventional (it starts
          # with "Merge", not a type), so the gate failed on the forge's own
          # message while every commit it wrapped was valid:
          #     ✖ subject must not be sentence-case [subject-case]
          #
          # Lint the commits a human wrote: `git log --no-merges` for the range,
          # then one commitlint call per subject. A bad subject on a real commit
          # still fails, which is the property that matters.
          # WHICH COMMITS ARE NEW ON A PUSH? (2026-11-21)
          #
          # The old push branch linted `HEAD~1..HEAD`. On a MERGED PR that is the
          # merge commit, whose subject Forgejo writes as
          #     Merge pull request '<PR title>' (#N) from <branch> into main
          # -- prose that can never satisfy config-conventional, so the gate
          # failed on the forge's own message while every real commit was valid:
          #     subject must not be sentence-case [subject-case]
          #
          # The merge commit is excluded with `--no-merges`, and the range is the
          # commits that ACTUALLY ARRIVED: `HEAD^2` (the merged branch tip) is
          # used when HEAD is a merge, so the range is every commit the merge
          # brought in. Comparing against the first parent's true merge-base
          # avoids linting a merge's own side branch twice.
          #
          # .commitlintrc.yml is the authoritative config -- .github/workflows/
          # ci.yml pins it by name -- so subject-case applies and a real
          # sentence-case subject still fails below.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [ "$(git rev-list --parents -n1 HEAD | wc -w)" -gt 2 ]; then
            RANGE="$(git merge-base HEAD^1 HEAD^2)..HEAD^2"
          else
            RANGE="HEAD~1..HEAD"
          fi
          git log --no-merges --format="%s" "$RANGE" | while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            echo "$msg" | npx commitlint || exit 1
          done
