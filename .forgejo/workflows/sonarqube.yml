name: SonarQube Analysis

# DISABLED (audit 2026-09-11 P1): no SonarQube server is deployed on the
# fleet (port 9000 is ClickHouse; the gopass sonarqube_token predates that
# repurposing). This workflow failed 117 consecutive runs on missing/unusable
# SONAR_HOST_URL. To re-enable: deploy a SonarQube server, set the
# SONAR_HOST_URL + SONAR_TOKEN repo secrets, and remove the `if: false` below.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sonar:
    name: SonarQube Scan
    if: false # disabled — see comment above
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - name: Install Node.js for actions/checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv + setup
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
          uv python install 3.11
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          pytest tests/ -x -q --tb=short --cov=. --cov-report=xml:coverage.xml -m "not integration"

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.projectKey=pryscraper
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.python.version=3.11
