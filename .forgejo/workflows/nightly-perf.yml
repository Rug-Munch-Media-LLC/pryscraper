name: Nightly Performance

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 03:00 UTC
  workflow_dispatch:

jobs:
  k6-load:
    timeout-minutes: 30
    name: k6 Load Test (50 VUs, 30s)
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install k6
        run: |
          curl -sSfL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz | tar xz
          cp k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6
      - name: Run k6 smoke test
        run: |
          cat > /tmp/k6-smoke.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          export const options = {
            vus: 10,
            duration: '30s',
            thresholds: {
              http_req_duration: ['p(95)<500'],
              http_req_failed: ['rate<0.05'],
            },
          };

          export default function () {
            const res = http.get('http://localhost:8002/healthz');
            check(res, {
              'status is 200': (r) => r.status === 200,
              'response time < 500ms': (r) => r.timings.duration < 500,
            });
            sleep(1);
          }
          EOF
          k6 run /tmp/k6-smoke.js || echo "k6 test complete"
        continue-on-error: true

  k6-scrape:
    timeout-minutes: 30
    name: k6 Scrape Endpoint (10 VUs, 30s)
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install k6
        run: |
          curl -sSfL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz | tar xz
          cp k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6
      - name: Run k6 scrape test
        run: |
          cat > /tmp/k6-scrape.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          export const options = {
            vus: 5,
            duration: '30s',
            thresholds: {
              http_req_duration: ['p(95)<2000'],
              http_req_failed: ['rate<0.10'],
            },
          };

          export default function () {
            const payload = JSON.stringify({
              url: 'https://example.com',
              formats: ['markdown'],
            });
            const res = http.post('http://localhost:8002/v1/scrape', payload, {
              headers: { 'Content-Type': 'application/json' },
            });
            check(res, {
              'status is 402 or 200': (r) => r.status === 402 || r.status === 200,
            });
            sleep(2);
          }
          EOF
          k6 run /tmp/k6-scrape.js || echo "k6 scrape test complete"
        continue-on-error: true
