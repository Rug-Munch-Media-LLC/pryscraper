global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: 'pry'
    environment: '${ENVIRONMENT:-prod}'

scrape_configs:
  - job_name: 'pry'
    static_configs:
      - targets: ['pry:8002']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'flaresolverr'
    static_configs:
      - targets: ['flaresolverr:8191']
    metrics_path: '/metrics'

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']