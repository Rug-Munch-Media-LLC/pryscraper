# Pry — SLO rules. Fast window 1h, slow 6h. Every metric cited (file:line):
# pry_requests_total{method,endpoint,status} obs:63 / middleware_http.py:184
# pry_request_duration_seconds obs:65 / middleware_http.py:187
# pry_scrapes_total{method,status} obs:67/:233 · pry_scrape_duration_seconds obs:68/:234
# x402_challenges_sent_total metrics.py:48/:119 handler_response.py:64 · x402_settle_total :63/:137 handler_settle.py:253
# x402_settle_success_total :68/:141 · x402_settlement_volume_usd_total :83/:145 · x402_verify_* :53/:58
# pry_x402_gate_misconfigured_total config.py:21 / enforcement_stages.py:65
# pry_monitor_runs_total{status} scheduler.py:34/:47 (success|changed|error|retry|timeout)
# pry_monitor_last_success_timestamp{monitor} :35-37/:49 · pry_scheduler_heartbeat :38/:269
# SLOs: availability 99.5% · scrape p95<10s (1%) · conversion>=20% · settle fail<=2%
# · monitor success>=95%. 14.4x/6x burn applies where budget is small; latency and
# conversion use explicit dual-window thresholds (burn multiple would exceed 100%).
groups:
  - name: pry-slo-availability
    interval: 30s
    rules:
      - alert: PryAvailabilityBurnFast
        expr: |
          (sum(rate(pry_requests_total{status=~"5.."}[1h])) / clamp_min(sum(rate(pry_requests_total[1h])), .001) > 14.4 * .005)
          and (sum(rate(pry_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(pry_requests_total[5m])), .001) > 14.4 * .005)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "5xx burning availability budget >14.4x (1h+5m)", description: "99.5% SLO, >7.2% 5xx. RUNBOOK-SLO.md#pryavailabilityburnfast"}
      - alert: PryAvailabilityBurnSlow
        expr: |
          (sum(rate(pry_requests_total{status=~"5.."}[6h])) / clamp_min(sum(rate(pry_requests_total[6h])), .001) > 6 * .005)
          and (sum(rate(pry_requests_total{status=~"5.."}[30m])) / clamp_min(sum(rate(pry_requests_total[30m])), .001) > 6 * .005)
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "5xx burning availability budget >6x (6h+30m)", description: "Sustained >3% 5xx."}
  - name: pry-slo-scrape-latency
    interval: 60s
    rules:
      - alert: PryScrapeLatencyBurnFast
        expr: |
          (histogram_quantile(.95, sum by (le) (rate(pry_scrape_duration_seconds_bucket[1h]))) > 10)
          and (histogram_quantile(.95, sum by (le) (rate(pry_scrape_duration_seconds_bucket[5m]))) > 10)
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Scrape p95 above 10s SLO (1h+5m)", description: "Proxy/browser tiers saturated."}
      - alert: PryScrapeLatencyBurnSlow
        expr: |
          (histogram_quantile(.95, sum by (le) (rate(pry_scrape_duration_seconds_bucket[6h]))) > 10)
          and (histogram_quantile(.95, sum by (le) (rate(pry_scrape_duration_seconds_bucket[30m]))) > 10)
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "Scrape p95 above 10s SLO (6h+30m)", description: "Latency drift; compare by method."}
  - name: pry-slo-checkout-conversion
    interval: 60s
    rules:
      - alert: PryCheckoutConversionLowFast
        expr: |
          (sum(rate(x402_settle_success_total[1h])) / clamp_min(sum(rate(x402_challenges_sent_total[1h])), .001) < .10)
          and (sum(rate(x402_settle_success_total[5m])) / clamp_min(sum(rate(x402_challenges_sent_total[5m])), .001) < .10)
        for: 15m
        labels: {severity: critical}
        annotations: {summary: "402->settle conversion below half the 20% objective (1h+5m)", description: "Payment path losing conversions."}
      - alert: PryCheckoutConversionLowSlow
        expr: |
          (sum(rate(x402_settle_success_total[6h])) / clamp_min(sum(rate(x402_challenges_sent_total[6h])), .001) < .15)
          and (sum(rate(x402_settle_success_total[30m])) / clamp_min(sum(rate(x402_challenges_sent_total[30m])), .001) < .15)
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "402->settle conversion below 15% (6h+30m)", description: "Slow erosion — client mix/pricing/chain support."}
  - name: pry-slo-settlement
    interval: 60s
    rules:
      - alert: PrySettlementFailureBurnFast
        expr: |
          ((sum(rate(x402_settle_total[1h])) - sum(rate(x402_settle_success_total[1h]))) / clamp_min(sum(rate(x402_settle_total[1h])), .001) > 14.4 * .02)
          and ((sum(rate(x402_settle_total[5m])) - sum(rate(x402_settle_success_total[5m]))) / clamp_min(sum(rate(x402_settle_total[5m])), .001) > 14.4 * .02)
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Settlement failure >28.8% (1h+5m), 2% SLO", description: "Facilitator/RPC failing or replay rejections."}
      - alert: PrySettlementFailureBurnSlow
        expr: |
          ((sum(rate(x402_settle_total[6h])) - sum(rate(x402_settle_success_total[6h]))) / clamp_min(sum(rate(x402_settle_total[6h])), .001) > 6 * .02)
          and ((sum(rate(x402_settle_total[30m])) - sum(rate(x402_settle_success_total[30m]))) / clamp_min(sum(rate(x402_settle_total[30m])), .001) > 6 * .02)
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "Settlement failure >12% (6h+30m), 2% SLO", description: "Confirm chain RPC latency and facilitator balance."}
  - name: pry-slo-monitor-liveness
    interval: 30s
    rules:
      - alert: PrySchedulerHeartbeatStale
        expr: |
          (time() - pry_scheduler_heartbeat > 90)
          or on() (absent(pry_scheduler_heartbeat) and (count(up{job="pry"} == 1) > 0))
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Scheduler heartbeat older than 3x interval (90s)", description: "Loop stalled or PRY_SCHEDULER_ENABLED=0."}
      - alert: PryMonitorRunErrorRateHighFast
        expr: |
          (sum(rate(pry_monitor_runs_total{status=~"error|timeout"}[1h])) / clamp_min(sum(rate(pry_monitor_runs_total[1h])), .001) > .30)
          and (sum(rate(pry_monitor_runs_total{status=~"error|timeout"}[5m])) / clamp_min(sum(rate(pry_monitor_runs_total[5m])), .001) > .30)
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "Monitor runs failing >30% (1h+5m)", description: "Target down or concurrency too low."}
      - alert: PryMonitorRunErrorRateHighSlow
        expr: |
          (sum(rate(pry_monitor_runs_total{status=~"error|timeout"}[6h])) / clamp_min(sum(rate(pry_monitor_runs_total[6h])), .001) > .15)
          and (sum(rate(pry_monitor_runs_total{status=~"error|timeout"}[30m])) / clamp_min(sum(rate(pry_monitor_runs_total[30m])), .001) > .15)
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "Monitor runs failing >15% (6h+30m)", description: "Chronic monitor failures."}
      # Global, not per-series: schedules are DB-only (scheduler.py:255), so a
      # per-monitor threshold would false-page daily crons.
      - alert: PryMonitorNoSuccess12h
        expr: |
          (time() - max(pry_monitor_last_success_timestamp) > 43200)
          and on() (sum(increase(pry_monitor_runs_total[6h])) > 0)
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "No monitor succeeded in 12h while runs continue", description: "All runs failing, or success gauge not set."}
      # No `tier` label exists (obs:67); `method` is the exposed routing tier.
      - alert: PryScrapeMethodSuccessDegraded
        expr: |
          (sum by (method) (rate(pry_scrapes_total{status="success"}[15m])) / clamp_min(sum by (method) (rate(pry_scrapes_total[15m])), .001)) < .70
          and on(method) (sum by (method) (rate(pry_scrapes_total[15m])) > .01)
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Scrape method {{ $labels.method }} success below 70%", description: "One tier degraded while others run."}
  - name: pry-scrape-success
    interval: 60s
    rules:
      # THRESHOLD IS MEASURED, NOT ASPIRATIONAL (2026-10-23).
      #
      # 0.90 was unreachable by construction: two hosts that Cloudflare blocks
      # permanently dominate the paid path — x.com 163 errors/24h and medium.com
      # 117/24h (audit_events.detail->>'host', 480 errors / 23 successes), i.e.
      # 58% of every paid-path failure. No local change clears them; they need
      # residential egress.
      #
      # Measured distribution (pry-prometheus, [3h] ratio, n=181, the only
      # 15h in which the error leg exists — it first appears 2026-10-22T16:53Z,
      # so a 7d query is a step function at 1.0 and is NOT evidence):
      #   min 0.465  p10 0.516  p25 0.565  median 0.639  mean 0.672  p90 0.888
      #   volume-weighted ceiling over the window: 0.684
      # 0.50 = just under p10: fires only when a 3h window is in the bottom 8%
      # of what THIS target mix has actually achieved (0/181 samples < 0.45).
      # Raising the bar to 0.60 would be red 34% of the time; 0.90 is red 100%.
      # The structural cause has its own signal below — do not "fix" this one by
      # raising it again.
      - alert: PryScrapeSuccessRateLow
        expr: |
          (sum(rate(pry_scrapes_total{status="success"}[3h])) / clamp_min(sum(rate(pry_scrapes_total[3h])), .001)) < .50
          # Require real volume before judging a ratio: with ~2 events in the
          # window a single failure reads as a 20% success rate and pages.
          unless sum(rate(pry_scrapes_total[3h])) < 0.01
        for: 45m
        labels: {severity: warning}
        annotations: {summary: "Scrape success below 50% for 3h (measured floor 0.50)", description: "Below the bottom decile of the achievable distribution for the current target mix; see PryCfBlockShareHigh for the structural cause."}

      # Structural, not alertable: the share of failures Cloudflare blocks
      # outright. Recording rule so the dashboard explains a low success ratio
      # instead of someone paging on it. 0.58 of failures on 2026-10-23.
      # ``or vector(0)`` on both legs: a plain sum() of an absent series yields
      # NO sample, so the rule would write nothing — and a dashboard would show a
      # hole exactly when blocked failures are zero. Missing must read as 0.
      - record: pry:cf_block_share:ratio
        expr: |
          (sum(rate(pry_scrape_failures_total{reason="blocked"}[1h])) or vector(0))
          / clamp_min(sum(rate(pry_scrape_failures_total[1h])) or vector(0), .001)
      - alert: PryScraperIdle
        expr: |
          (sum(rate(pry_scrapes_total[15m])) == 0)
          and on() (count(up{job="pry"} == 1) > 0)
        for: 2h
        labels: {severity: warning}
        annotations: {summary: "Pry scraper idle 2h (target up)", description: "Nothing collected while API is up."}
  - name: pry-service-health
    interval: 30s
    rules:
      # Per-endpoint attribution. The old rule summed by (le) only, so all ~380
      # routes shared ONE p95: a single slow route was invisible, and an
      # instrumentation regression (every request labelled `unmatched`) read as
      # fleet-wide slowness for weeks. Same 5s threshold, same 20m hold-down;
      # the only change is `by (le, endpoint)`, so the alert names the route.
      # `unmatched` is excluded here because it is not a route — it is the
      # sentinel that PryEndpointUnmatchedHigh owns.
      - alert: PryRequestP95LatencyHigh
        expr: |
          histogram_quantile(.95,
            sum by (le, endpoint) (
              rate(pry_request_duration_seconds_bucket{endpoint!~"unmatched|/metrics"}[10m])))
          > 5
        for: 20m
        labels: {severity: warning}
        annotations:
          summary: 'Endpoint {{ $labels.endpoint }} p95 latency {{ $value | printf "%.2f" }}s > 5s for 20m'
          description: "Route-scoped p95 (was fleet-wide). Compare with pry_scrape_duration_seconds by tier before paging the on-call: a slow route is a route bug, not fleet saturation."
      # Instrumentation regression, NOT latency — its own name on purpose.
      # Origin: FastAPI >= 0.141 keeps include_router() output as a lazy
      # _IncludedRouter, so _path_exists() saw no routes and every request took
      # the unknown-path pass-through (no request logging, no pre-auth rate
      # limiting, no billing, endpoint=\"unmatched\"). Fixed in 8ff0a354.
      # A 404 is a genuinely unknown path (internet scanner noise) and is
      # EXCLUDED from the numerator: only requests that were served (200/3xx/
      # 401/402/5xx) while classified `unmatched` prove the resolver is blind.
      - alert: PryEndpointUnmatchedHigh
        expr: |
          sum(rate(pry_requests_total{endpoint="unmatched",status!~"404"}[10m]))
          / clamp_min(sum(rate(pry_requests_total[10m])), .001)
          > .02
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "{{ $value | humanizePercentage }} of served requests classified `unmatched`"
          description: "Route resolution is broken: every served request is being treated as an unknown path, so rate limiting, request logging and billing enforcement are bypassed. Run pytest tests/test_middleware.py -k real_app and check _path_exists against the real app object."
      # Dashboard inputs. unmatched_all includes 404 scanner noise; routed
      # excludes it, so `routed` above 0 means the resolver is blind.
      - record: pry:unmatched_share:ratio
        expr: |
          sum(rate(pry_requests_total{endpoint="unmatched"}[10m]))
          / clamp_min(sum(rate(pry_requests_total[10m])), .001)
      - record: pry:routed_unmatched_share:ratio
        expr: |
          sum(rate(pry_requests_total{endpoint="unmatched",status!~"404"}[10m]))
          / clamp_min(sum(rate(pry_requests_total[10m])), .001)
      - alert: PryPaymentGateMisconfigured
        expr: increase(pry_x402_gate_misconfigured_total[5m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations: {summary: "x402 gate misconfiguration detected", description: "Paid prefix without X402_PRICING; fails closed 500."}
      # Fires on REAL downtime (verified 2026-10-23: 66 one-minute samples
      # with up==0 between 07:36 and 09:04 local, then container restart).
      # A misconfigured PORT also lands here as up==0 — but a host-side
      # `curl 127.0.0.1:8002` returning 000 is the expected view of an
      # unpublished port, not proof of misconfiguration. The scrape target is
      # the CONTAINER port (8002); the host publishes 8005. See prometheus.yml.
      - alert: pry_container_down
        expr: up{job="pry"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Pry API container down for 2m"}
      - alert: pry_high_error_rate
        expr: sum(rate(pry_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(pry_requests_total[5m])), .001) > .10
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Pry 5xx error rate above 10% for 5m"}
      - alert: pry_pg_down
        expr: up{job="postgres"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Pry postgres exporter down for 2m"}
      - alert: pry_redis_down
        expr: up{job="redis"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Pry redis exporter down for 2m"}
      - alert: pry_public_api_down
        expr: probe_success{job="public-api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Public API https://api.pryscraper.com/health failing"}
  # Queue-window SLIs. `pry_queue_depth` / `pry_queue_oldest_job_age_seconds`
  # are emitted by observability.JobQueueCollector at scrape time (no caller,
  # so a plain Gauge would never produce a series).
  - name: pry-slo-queue-lag
    interval: 60s
    rules:
      - alert: PryQueueLagHigh
        expr: pry_queue_oldest_job_age_seconds > 300
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Oldest batch job age {{ $value | humanizeDuration }} (>5m) for 10m"
          description: "Queue is draining slower than it fills. Check worker count and PRY_MAX_SESSIONS; see docs/ops/SLO.md#queue-lag."
      - alert: PryQueueBacklog
        expr: pry_queue_depth > 100
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Batch queue depth {{ $value }} (>100) for 10m"
          description: "Backlog growing. Scale workers or shed load; see docs/ops/SLO.md#queue-lag."
  - name: pry-slo-scrape-latency-p99
    interval: 60s
    rules:
      - alert: PryScrapeLatencyP99High
        expr: |
          (histogram_quantile(.99, sum by (le) (rate(pry_scrape_duration_seconds_bucket[1h]))) > 20)
          and (histogram_quantile(.99, sum by (le) (rate(pry_scrape_duration_seconds_bucket[10m]))) > 20)
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Scrape p99 above 20s (1h+10m)"
          description: "Tail latency, not the median. Default histogram buckets cap at 10s, so a value pinned at 10 means '>10s' — see docs/ops/SLO.md#caveats."
