# ── RugMunch CANONICAL Lefthook Configuration ─────────────────
# Source of truth: standards/lefthook.yml
# ALL repos symlink .lefthook.yml -> ../standards/lefthook.yml
#
# GLOBAL TIMEOUT: every command is killed after 10 minutes. Lefthook SIGTERMs
# the command shell; node-based children (pyright/tsserver) can survive as
# orphans — the host cron reaper (/root/scripts/reap-stale-tools.sh, every
# 15 min) kills anything orphaned or older than 20 min. Never remove this.
timeout: 600
#
# This single config handles ALL repo types via glob patterns:
#   *.py              -> ruff, vulture, radon, interrogate, pip-audit, semgrep, pyright (Python repos)
#   *.{ts,tsx,js,jsx} -> biome, oxlint, tsc, knip, attw (Frontend repos)
#   package.json      -> publint (Frontend repos)
#   *.sh              -> shellcheck (Infra repos)
#   Dockerfile*       -> hadolint (Infra repos)
#   *.sql             -> squawk (DB migration repos)
#
# Quick install:
#   lefthook install
#   lefthook run pre-commit    # test hooks
#   lefthook run pre-push      # test push hooks
#
# NOTE: --no-verify bypasses client hooks. Server-side CI is the real gate.
#
# Full tool roster:
#   Python lint:        ruff, mypy, pyright, bandit, semgrep
#   Python quality:     vulture (dead code), radon (complexity), interrogate (docstrings)
#   Python deps:        deptry (freshness), pip-audit (vulnerabilities)
#   Frontend lint:      biome, oxlint, tsc --noEmit
#   Frontend quality:   knip (dead code), publint (pkg.json), attw (type exports)
#   Container/Infra:    hadolint (Dockerfile), shellcheck (.sh), squawk (.sql)
#   Security universal: gitleaks, envsitter, methodology-leak
#
# HOW TO ADD REPO-SPECIFIC OVERRIDES:
# If a repo needs EXTRA hooks on top of canonical, create
# .lefthook.local.yml in the repo root. Lefthook merges it
# automatically. Example:
#
#   pre-commit:
#     commands:
#       my-custom-check:
#         run: ./scripts/my-check.sh

pre-commit:
  parallel: true
  commands:
    # -- AI Test Oracle advisory (PYTHON repos, opt-in) ---------
    # Fires when staged test files match a repo's .critical-paths list.
    # Advisory only; repos promote to blocking via .lefthook.local.yml.
    test-oracle-check:
      glob: "tests/**/*.py"
      run: bash scripts/check-test-oracle.sh "{staged_files}" 2>/dev/null || true

    # -- Methodology leak detection (UNIVERSAL) -----------------
    methodology-leak:
      run: bash scripts/pre-commit-methodology-check.sh
      skip:
        - merge
        - rebase

    # -- Repo domain boundary (FLEET, opt-in) -------------------
    # "Keep agents in their lanes": blocks staged files whose domain belongs
    # to a DIFFERENT repo (e.g. *.sol/foundry outside contextcrypto/contracts,
    # scanner-engine code outside rugmunch-scanner, bot content outside
    # rugmunchbot). Reads standards/repo-domains.json. Active only where
    # scripts/repo-boundary-check.sh is present, so non-enforced repos skip.
    repo-boundary:
      glob: "*"
      run: |
        if [ -f scripts/repo-boundary-check.sh ]; then
          bash scripts/repo-boundary-check.sh {staged_files}
        fi

    # -- BLOCK .env files (UNIVERSAL) --------------------------
    # Blocks .env files git would actually TRACK. Local runtime .env files
    # covered by .gitignore are legitimate (e.g. chain-indexer) and must
    # not block commits — gitleaks --staged remains the content backstop.
    no-env-files:
      run: |
        VIOLATIONS=""
        for f in $(find . -maxdepth 3 -name '.env' -not -name '.env.example' \
          -not -path './.git/*' \
          -not -path '*/node_modules/*' \
          -not -path '*/venv/*' \
          -not -path '*/.venv/*' \
          -not -path '*/__pycache__/*' \
          -not -path '*/bridge/.env' \
          -not -path './dockflare/.env'); do
          git check-ignore -q "$f" 2>/dev/null || VIOLATIONS="$VIOLATIONS  $f"$'\n'
        done
        if [ -n "$VIOLATIONS" ]; then
          echo "ERROR: trackable .env file(s) found:"
          printf "$VIOLATIONS"
          echo "Move secrets to gopass. Run: gopass show <path>"
          exit 1
        fi
      skip:
        - merge
        - rebase

    # -- Secret scanning (UNIVERSAL) ---------------------------
    # Uses per-repo .gitleaks.toml (supports repo-specific allowlists);
    # falls back to canonical standards config.
    gitleaks:
      run: |
        if [ -f .gitleaks.toml ]; then
          gitleaks protect --staged --config .gitleaks.toml --verbose
        elif [ -f ../standards/.gitleaks.toml ]; then
          gitleaks protect --staged --config ../standards/.gitleaks.toml --verbose
        fi

    # -- envsitter validation (UNIVERSAL) ----------------------
    envsitter:
      run: envsitter validate --file .env 2>/dev/null || true

    # -- Python lint (PYTHON repos) ---------------------------
    ruff:
      glob: "*.py"
      run: ruff check --fix {staged_files} && ruff format {staged_files}
      stage_fixed: true

    # -- Python dead code detection (PYTHON repos) -------------
    vulture:
      glob: "*.py"
      run: vulture {staged_files} 2>/dev/null || echo "vulture check complete (see warnings above)"

    # -- Python complexity analysis (PYTHON repos) -------------
    radon:
      glob: "*.py"
      run: radon cc {staged_files} -a -nb 2>/dev/null || true

    # -- Python docstring coverage (PYTHON repos) --------------
    # Scans repo root so per-repo pyproject [tool.interrogate] config
    # (excludes, thresholds) applies. Explicit staged-file paths bypass
    # that config and false-positive on test files.
    interrogate:
      glob: "*.py"
      run: "interrogate . --fail-under=60 2>/dev/null || echo 'interrogate: docstring coverage below threshold'"

    # -- Dependency vulnerability scan (PYTHON repos) ----------
    pip-audit:
      glob: "*.py"
      run: |
        if [ -f "requirements*.txt" ] || [ -f "pyproject.toml" ]; then
          pip-audit --severity high --desc 2>/dev/null || echo "pip-audit: vulnerabilities found (run manually to review)"
        fi

    # -- SAST via semgrep (PYTHON repos) -----------------------
    semgrep:
      glob: "*.py"
      run: |
        if [ -f ".semgrep.yml" ] || [ -f ".semgrep.toml" ]; then
          semgrep --config=auto --metrics=off --error --quiet {staged_files} 2>/dev/null || true
        fi

    # -- Python type check via pyright (PYTHON repos, faster alternative) --
    pyright:
      glob: "*.py"
      run: |
        if [ -f "pyproject.toml" ] && command -v pyright &>/dev/null; then
          pyright {staged_files} 2>/dev/null || true
        fi

    # -- Frontend lint (FRONTEND repos) -----------------------
    biome:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    oxlint:
      glob: "*.{ts,tsx,js,jsx}"
      run: npx oxlint@1.79.0 --max-warnings=0 {staged_files}

    # -- Frontend package.json validation (FRONTEND repos) -----
    publint:
      glob: "package.json"
      run: npx publint@0.3.24 2>/dev/null || true

    # -- Frontend type export validation (FRONTEND repos) ------
    attw:
      glob: "*.{ts,tsx}"
      run: |
        if [ -f "package.json" ]; then
          npx attw@0.18.5 --pack . 2>/dev/null || true
        fi

    # -- Shell lint (INFRA repos) -----------------------------
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}

    # -- Dockerfile lint (INFRA repos) ------------------------
    hadolint:
      glob: "Dockerfile*"
      run: hadolint {staged_files}

    # -- SQL migration lint (DB repos) ------------------------
    squawk:
      glob: "*.sql"
      run: squawk {staged_files} 2>/dev/null || echo "Squawk not available — skipping SQL lint"

    # -- SQL lint, general (ClickHouse + Postgres + ad-hoc) ----
    # Complements Squawk (migrations-only). Blocking: cheap, low FP.
    sqlfluff:
      glob: "*.sql"
      run: |
        if command -v sqlfluff >/dev/null 2>&1; then
          sqlfluff lint --dialect postgres {staged_files} 2>/dev/null || \
          sqlfluff lint --dialect ansi {staged_files} || echo "[sqlfluff] findings above"
        else
          echo "sqlfluff not installed — pipx install sqlfluff"
        fi

    # -- Dependency supply-chain check (UNIVERSAL) -------------
    # Blocks hallucinated/typosquatted/vulnerable deps AT COMMIT TIME.
    # AI agents invent package names — this is the gate that stops them.
    osv-deps:
      glob: "{requirements*.txt,Pipfile.lock,poetry.lock,package-lock.json,pnpm-lock.yaml,yarn.lock,Cargo.lock,go.mod}"
      run: |
        if command -v osv-scanner >/dev/null 2>&1; then
          FILES=$(printf '%s\n' {staged_files} | grep -E '(requirements.*\.txt|Pipfile\.lock|poetry\.lock|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|Cargo\.lock|go\.mod)$' | tr '\n' ' ')
          if [ -n "$FILES" ]; then
            osv-scanner scan source $FILES || echo "[osv] vulnerable deps in lockfile — advisory at commit; CI blocks triaged diffs; major bumps in work order"
          fi
        else
          echo "osv-scanner not installed — install from google/osv-scanner releases"
        fi

pre-push:
  parallel: true
  commands:
    # -- Methodology leak detection (CRITICAL, fast) ------------
    methodology-leak:
      run: bash scripts/pre-commit-methodology-check.sh

    # -- Full-repo secret scan (CRITICAL, fast) ----------------
    gitleaks-full:
      run: |
        if [ -f .gitleaks.toml ]; then
          gitleaks detect --source . --no-git --config .gitleaks.toml -v
        elif [ -f ../standards/.gitleaks.toml ]; then
          gitleaks detect --source . --no-git --config ../standards/.gitleaks.toml -v
        fi

    # -- Live-secret verification (CRITICAL) -------------------
    trufflehog-verified:
      run: |
        if command -v trufflehog >/dev/null 2>&1; then
          RANGE=$(git rev-parse @{u} 2>/dev/null || echo "")
          if [ -n "$RANGE" ]; then
            trufflehog git file://. --since-commit "$RANGE" --results=verified --fail --no-update || {
              echo "TRUFFLEHOG: verified-LIVE secret(s) in pushed commits. Rotate now (gopass)."
              exit 1
            }
          else
            echo "no upstream — skipping incremental secret verification"
          fi
        else
          echo "trufflehog not installed — install from trufflesecurity/trufflehog releases"
        fi

    # -- Module boundary contracts (CRITICAL, fast) -------------
    import-boundaries:
      glob: "*.py"
      run: |
        if command -v lint-imports >/dev/null 2>&1; then
          if grep -qE '\[importlinter\]' pyproject.toml setup.cfg .importlinter 2>/dev/null; then
            LINT_IMPORTS_BIN="lint-imports"
            if [ -x ".venv/bin/lint-imports" ]; then LINT_IMPORTS_BIN=".venv/bin/lint-imports"; fi
            "$LINT_IMPORTS_BIN" || {
              echo "IMPORT-LINTER: architecture boundary violated (see above)."
              exit 1
            }
          fi
        fi

    # ── ALL OTHER CHECKS DEFERRED TO CI ──────────────────────
    # pyright (49s), test (55s), bandit (20s), grype (40s), vulture,
    # interrogate, semgrep, pip-audit, deptry, mypy, bearer-scan,
    # typecheck, knip, audit, publint, attw — all run in CI post-push.
    # CI runs 21 jobs (.forgejo/workflows/ci.yml) — that's the gate.
    # Pre-push target: <10 seconds. Secret detection + boundaries only.

commit-msg:
  commands:
    commitlint:
      # --config is explicit: config DISCOVERY fails in this repo (no
      # package.json for cosmiconfig to anchor on), which silently dropped
      # the fleet rules (ops: type, subject-case off) and fell back to
      # built-in conventional defaults.
      run: commitlint --edit "$1" --config commitlint.config.js
    # -- AI attribution advisory (AI Test Oracle Policy rule 5) --
    # feat/fix commits should carry `Assisted-by: <agent> <model>` when
    # AI-authored. Advisory only — prints a hint, never blocks.
    ai-attribution:
      run: |
        msg=$(cat "$1" 2>/dev/null || true)
        case "$msg" in
          feat:*|fix:*|perf:*|refactor:*)
            echo "$msg" | grep -qi "^Assisted-by:" || \
              echo "ℹ️  AI-authored? add trailer: 'Assisted-by: <agent> <model>' (advisory)"
            ;;
        esac
