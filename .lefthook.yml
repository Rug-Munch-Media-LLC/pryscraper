pre-commit:
  parallel: true
  commands:
    test-oracle-check:
      glob: tests/**/*.py
      run: bash scripts/check-test-oracle.sh "{staged_files}" 2>/dev/null || true
    methodology-leak:
      run: bash scripts/pre-commit-methodology-check.sh
      skip:
      - merge
      - rebase
    repo-boundary:
      glob: '*'
      run: "if [ -f scripts/repo-boundary-check.sh ]; then\n  bash scripts/repo-boundary-check.sh {staged_files}\nfi\n"
    no-env-files:
      run: "VIOLATIONS=\"\"\nfor f in $(find . -maxdepth 3 -name '.env' -not -name '.env.example' \\\n  -not -path './.git/*' \\\n  -not -path '*/node_modules/*' \\\n  -not -path '*/venv/*' \\\n  -not -path '*/.venv/*' \\\n  -not -path '*/__pycache__/*' \\\n  -not -path '*/bridge/.env' \\\n  -not -path './dockflare/.env'); do\n  git check-ignore -q \"$f\" 2>/dev/null || VIOLATIONS=\"$VIOLATIONS  $f\"$'\\n'\ndone\nif [ -n \"$VIOLATIONS\" ]; then\n  echo \"ERROR: trackable .env file(s) found:\"\n  printf \"$VIOLATIONS\"\n  echo \"Move secrets to gopass. Run: gopass show <path>\"\n  exit 1\nfi\n"
      skip:
      - merge
      - rebase
    gitleaks:
      run: "if [ -f .gitleaks.toml ]; then\n  gitleaks protect --staged --config .gitleaks.toml --verbose\nelif [ -f ../standards/.gitleaks.toml ]; then\n  gitleaks protect --staged --config ../standards/.gitleaks.toml --verbose\nfi\n"
    envsitter:
      run: envsitter validate --file .env 2>/dev/null || true
    ruff:
      glob: '*.py'
      run: ruff check --fix {staged_files} && ruff format {staged_files}
      stage_fixed: true
    vulture:
      glob: '*.py'
      run: vulture {staged_files} 2>/dev/null || echo "vulture check complete (see warnings above)"
    radon:
      glob: '*.py'
      run: radon cc {staged_files} -a -nb 2>/dev/null || true
    interrogate:
      glob: '*.py'
      run: 'interrogate . --fail-under=60 2>/dev/null || echo ''interrogate: docstring coverage below threshold'''
    pip-audit:
      glob: '*.py'
      run: "if [ -f \"requirements*.txt\" ] || [ -f \"pyproject.toml\" ]; then\n  pip-audit --severity high --desc 2>/dev/null || echo \"pip-audit: vulnerabilities found (run manually to review)\"\nfi\n"
    semgrep:
      glob: '*.py'
      run: "if [ -f \".semgrep.yml\" ] || [ -f \".semgrep.toml\" ]; then\n  semgrep --config=auto --metrics=off --error --quiet {staged_files} 2>/dev/null || true\nfi\n"
    pyright:
      glob: '*.py'
      run: "if [ -f \"pyproject.toml\" ] && command -v pyright &>/dev/null; then\n  pyright {staged_files} 2>/dev/null || true\nfi\n"
    biome:
      glob: '*.{ts,tsx,js,jsx,json,css}'
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    oxlint:
      glob: '*.{ts,tsx,js,jsx}'
      run: npx oxlint@1.79.0 --max-warnings=0 {staged_files}
    publint:
      glob: package.json
      run: npx publint@0.3.24 2>/dev/null || true
    attw:
      glob: '*.{ts,tsx}'
      run: "if [ -f \"package.json\" ]; then\n  npx attw@0.18.5 --pack . 2>/dev/null || true\nfi\n"
    shellcheck:
      glob: '*.sh'
      run: shellcheck {staged_files}
    hadolint:
      glob: Dockerfile*
      run: hadolint {staged_files}
    squawk:
      glob: '*.sql'
      run: "squawk {staged_files} 2>/dev/null || echo \"Squawk not available \u2014 skipping SQL lint\""
    sqlfluff:
      glob: '*.sql'
      run: "if command -v sqlfluff >/dev/null 2>&1; then\n  sqlfluff lint --dialect postgres {staged_files} 2>/dev/null || \\\n  sqlfluff lint --dialect ansi {staged_files} || echo \"[sqlfluff] findings above\"\nelse\n  echo \"sqlfluff not installed \u2014 pipx install sqlfluff\"\nfi\n"
    osv-deps:
      glob: '{requirements*.txt,Pipfile.lock,poetry.lock,package-lock.json,pnpm-lock.yaml,yarn.lock,Cargo.lock,go.mod}'
      run: "if command -v osv-scanner >/dev/null 2>&1; then\n  FILES=$(printf '%s\\n' {staged_files} | grep -E '(requirements.*\\.txt|Pipfile\\.lock|poetry\\.lock|package-lock\\.json|pnpm-lock\\.yaml|yarn\\.lock|Cargo\\.lock|go\\.mod)$' | tr '\\n' ' ')\n  if [ -n \"$FILES\" ]; then\n    osv-scanner scan source $FILES || echo \"[osv] vulnerable deps in lockfile \u2014 advisory at commit; CI blocks triaged diffs; major bumps in work order\"\n  fi\nelse\n  echo \"osv-scanner not installed \u2014 install from google/osv-scanner releases\"\nfi\n"
pre-push:
  parallel: true
  commands:
    methodology-leak:
      run: bash scripts/pre-commit-methodology-check.sh
    gitleaks-full:
      run: "if [ -f .gitleaks.toml ]; then\n  gitleaks detect --source . --no-git --config .gitleaks.toml -v\nelif [ -f ../standards/.gitleaks.toml ]; then\n  gitleaks detect --source . --no-git --config ../standards/.gitleaks.toml -v\nfi\n"
    trufflehog-verified:
      run: "if command -v trufflehog >/dev/null 2>&1; then\n  RANGE=$(git rev-parse @{u} 2>/dev/null || echo \"\")\n  if [ -n \"$RANGE\" ]; then\n    trufflehog git file://. --since-commit \"$RANGE\" --results=verified --fail --no-update || {\n      echo \"TRUFFLEHOG: verified-LIVE secret(s) in pushed commits. Rotate now (gopass).\"\n      exit 1\n    }\n  else\n    echo \"no upstream \u2014 skipping incremental secret verification\"\n  fi\nelse\n  echo \"trufflehog not installed \u2014 install from trufflesecurity/trufflehog releases\"\nfi\n"
    import-boundaries:
      glob: '*.py'
      run: "if command -v lint-imports >/dev/null 2>&1; then\n  if grep -qE '\\[importlinter\\]' pyproject.toml setup.cfg .importlinter 2>/dev/null; then\n    LINT_IMPORTS_BIN=\"lint-imports\"\n    if [ -x \".venv/bin/lint-imports\" ]; then LINT_IMPORTS_BIN=\".venv/bin/lint-imports\"; fi\n    \"$LINT_IMPORTS_BIN\" || {\n      echo \"IMPORT-LINTER: architecture boundary violated (see above).\"\n      exit 1\n    }\n  fi\nfi\n"
commit-msg:
  commands:
    commitlint:
      run: commitlint --edit "$1" --config commitlint.config.js
    ai-attribution:
      run: "msg=$(cat \"$1\" 2>/dev/null || true)\ncase \"$msg\" in\n  feat:*|fix:*|perf:*|refactor:*)\n    echo \"$msg\" | grep -qi \"^Assisted-by:\" || \\\n      echo \"\u2139\uFE0F  AI-authored? add trailer: 'Assisted-by: <agent> <model>' (advisory)\"\n    ;;\nesac\n"
    methodology-leak-msg:
      run: bash scripts/commit-msg-methodology-check.sh {1}
      skip:
      - merge
      - rebase
