# ── RugMunch Python Lefthook Configuration ───────────────────
# Source of truth: standards/templates/lefthook-base.yml (python variant)
# Customizations:
#   - mypy/bandit run on full project (not app/) due to pryscraper structure
#   - deptry pre-push (project-specific dependency check)

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --no-banner --verbose
    envsitter:
      run: envsitter validate --file .env
    ruff:
      glob: "*.py"
      run: ruff check --fix {staged_files} && ruff format {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    gitleaks-full:
      run: gitleaks detect --source . --no-git -v
    mypy:
      run: mypy pryscraper/ --ignore-missing-imports
    bandit:
      run: bandit -c pyproject.toml -r pryscraper/ -ll
    deptry:
      run: deptry .
    test:
      run: python3 -m pytest tests/ -x -q -m "not integration"

commit-msg:
  commands:
    commitlint:
      run: commitlint --edit "$1"
