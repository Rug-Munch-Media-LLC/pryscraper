apiVersion: 1

providers:
  - name: 'Pry Dashboards'
    orgId: 1
    folder: 'Pry'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
