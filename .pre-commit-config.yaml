repos:
  # Revs kept in lockstep with pyproject dev extras (audit 2026-09-12:
  # v0.11.0 flagged UP038 — a rule removed in modern ruff — and mypy v1.15.0
  # rejected the `untyped-decorator` disable_error_code).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # Same scope + leniency as the CI typecheck job (pyproject [tool.mypy]
        # carries the ratchet). Never --strict: the repo is not strict-typed.
        args: [src/, pry_mcp/, --python-version, "3.12", --ignore-missing-imports]
        pass_filenames: false
        additional_dependencies:
          - types-setuptools
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        # -ll: medium+ only — matches the CI bandit gate (LOW findings like
        # B404/B603/B311 are intentionally not gating). The `exclude` field
        # (not just -x) is required: pre-commit passes explicit file paths as
        # args and -x does not filter explicit args, so tests/ fixtures were
        # being scanned and failed the hook (audit 2026-09-12).
        args: [-r, -ll, -x, "./tests/*,./.venv/*,./__pycache__/*,./website/*,./actor_factory/*"]
        exclude: ^(tests/|website/|actor_factory/|mutants/)
        stages: [pre-commit]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
