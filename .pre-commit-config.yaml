repos:
  # Revs kept in lockstep with pyproject dev extras (audit 2026-09-12:
  # v0.11.0 flagged UP038 — a rule removed in modern ruff — and mypy v1.15.0
  # rejected the `untyped-decorator` disable_error_code).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # Same scope + leniency as the CI typecheck job (pyproject [tool.mypy]
        # carries the ratchet). Never --strict: the repo is not strict-typed.
        args: [src/, pry_mcp/, --python-version, "3.12", --ignore-missing-imports]
        pass_filenames: false
        additional_dependencies:
          - types-setuptools
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        # -ll: medium+ only — matches the CI bandit gate (LOW findings like
        # B404/B603/B311 are intentionally not gating). The `exclude` field
        # (not just -x) is required: pre-commit passes explicit file paths as
        # args and -x does not filter explicit args, so tests/ fixtures were
        # being scanned and failed the hook (audit 2026-09-12).
        args: [-r, -ll, -x, "./tests/*,./.venv/*,./__pycache__/*,./website/*,./actor_factory/*"]
        exclude: ^(tests/|website/|actor_factory/|mutants/)
        stages: [pre-commit]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # SCRAPED HTML FIXTURES MUST KEEP THEIR EXACT BYTES (2026-11-21).
        #
        # `tests/fixtures/scrape/*.html` are captures of real pages. Stripping
        # trailing whitespace from them edits the very markup the extractor is
        # tested against -- the fixture stops representing a real page, and the
        # test starts asserting about our reformatting instead of about the web.
        #
        # Measured: `pre-commit run --all-files` rewrote this fixture and then
        # failed on the diff (`files were modified by this hook`), so the
        # gate failed while reporting no problem with the code. A fixture that
        # is data, not source, belongs outside a source-formatting hook.
        # CAPTURED FIXTURE DATA KEEPS ITS EXACT BYTES (2026-11-21).
        #
        # These trees are byte-for-byte captures of real pages and real API
        # responses, kept so parsers are tested against what the web actually
        # returns. `pre-commit run --all-files` rewrote THREE of them and then
        # failed on its own diff (`files were modified by this hook`), so the
        # gate reported a failure while the code was correct:
        #     Fixing tests/fixtures/x/timeline_page.html
        #     Fixing tests/fixtures/x/tweet_result.json
        #     Fixing datasets/sports_data/fixtures/espn_scoreboard_nba_20260410.json
        # Whitespace IS the payload in HTML/JSON fixtures; stripping it changes
        # what the test asserts. Excluded per hook rather than per repo so the
        # formatting rules stay active on all real source.
        exclude: ^(tests/fixtures/|datasets/.*/fixtures/)
      - id: end-of-file-fixer
        # Same reasoning as trailing-whitespace above: a missing final newline in
        # a captured page is part of the capture.
        # CAPTURED FIXTURE DATA KEEPS ITS EXACT BYTES (2026-11-21).
        #
        # These trees are byte-for-byte captures of real pages and real API
        # responses, kept so parsers are tested against what the web actually
        # returns. `pre-commit run --all-files` rewrote THREE of them and then
        # failed on its own diff (`files were modified by this hook`), so the
        # gate reported a failure while the code was correct:
        #     Fixing tests/fixtures/x/timeline_page.html
        #     Fixing tests/fixtures/x/tweet_result.json
        #     Fixing datasets/sports_data/fixtures/espn_scoreboard_nba_20260410.json
        # Whitespace IS the payload in HTML/JSON fixtures; stripping it changes
        # what the test asserts. Excluded per hook rather than per repo so the
        # formatting rules stay active on all real source.
        exclude: ^(tests/fixtures/|datasets/.*/fixtures/)
      - id: check-yaml
        # docker-compose.selfhost.yml is valid Compose: it uses the `!reset`
        # and `!override` tags (Compose merge directives) that the hook's plain
        # yaml loader cannot construct. Excluded so a valid file stops failing
        # the hook. Audit 2026-10-05.
        exclude: ^docker-compose\.selfhost\.yml$
      - id: check-json
      - id: check-merge-conflict
