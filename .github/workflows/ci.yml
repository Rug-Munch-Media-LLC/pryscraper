name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly integration tests (Postgres + Redis) — non-blocking
    - cron: '30 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy --python-version 3.12 --strict --ignore-missing-imports --exclude 'build/|dist/|.git/|__pycache__/' *.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # `--cov=.` measures the whole repo (no `pryscraper` module exists).
      # fail_under=55 matches pyproject.toml [tool.coverage.report] fail_under.
      # Integration tests are excluded here; they run nightly in Forgejo CI.
      - run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=55 -m "not integration"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install bandit
      - run: bandit -r . -x tests/,.venv,__pycache__

  # Nightly (non-blocking): runs tests marked `integration` against a real
  # Postgres + Redis stack. Continue-on-error: infra flakiness must never
  # block mainline CI. The Forgejo workflow (.forgejo/workflows/ci.yml) is
  # the canonical integration runner; this job mirrors it for GitHub.
  integration-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pry
          POSTGRES_PASSWORD: pry
          POSTGRES_DB: pry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pry -d pry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Run integration tests (Postgres + Redis)
        env:
          PRY_DATABASE_URL: postgresql+asyncpg://pry:pry@localhost:5432/pry
          PRY_REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -m integration -q --tb=short || echo "integration tests failed (non-blocking)"
      - name: Run contract tests (Pact)
        run: pytest tests/contract/ -q --tb=short || echo "contract tests failed (non-blocking)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pacts
          path: tests/contract/pacts/

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml

  archfit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Install archfit
        run: go install github.com/alexei-led/archfit/cmd/archfit@latest || echo "archfit install skipped"
        continue-on-error: true
      - name: Run architecture fitness check
        run: |
          if command -v archfit &>/dev/null; then
            archfit analyze || echo "Architecture fitness: review needed"
          else
            echo "archfit not installed — skipping (non-blocking)"
          fi
        continue-on-error: true
