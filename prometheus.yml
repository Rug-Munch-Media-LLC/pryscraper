# Prometheus config for Pry monitoring.
#
# CANONICAL config is ./prometheus/prometheus.yml (mounted by both compose
# stacks). This root copy exists for tooling that probes the file directly and
# MUST stay behaviourally identical: same rules, same alertmanager target.
# Scrapes the public /metrics endpoint every 15s.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "pry"
    static_configs:
      - targets: ["pry:8002"]
    metrics_path: "/metrics"
    scheme: http
