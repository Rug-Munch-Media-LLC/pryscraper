# Prometheus config for Pry monitoring (canonical living config lives in
# ./prometheus/prometheus.yml — mounted by docker-compose; this root copy is
# kept in sync for tooling that probes the file directly).
# Scrapes the public /metrics endpoint every 15s.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "pry"
    static_configs:
      - targets: ["pry:8002"]
    metrics_path: "/metrics"
    scheme: http