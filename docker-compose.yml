#
# Production-hardened compose file:
#   * pry runs as non-root (Dockerfile `pry` user), read-only rootfs with
#     tmpfs scratch + named volumes for persistence
#   * healthcheck, resource limits, restart policy, init (zombie reaping),
#     no-new-privileges, and a graceful-shutdown stop grace period
#   * Postgres + Redis for production persistence
#   * Prometheus + Grafana for observability
#   * FlareSolverr and Tor are helper services (Tor behind the `tor` profile)
#   * every container_name is `${PRY_CONTAINER_PREFIX:-…}` so an operator
#     running a second stack (e.g. the self-host overlay) alongside this one
#     can namespace the names with PRY_CONTAINER_PREFIX. The DEFAULT renders
#     the current fleet names byte-for-byte (`pry`, `pry-postgres`, …), so the
#     Talos deployment is unaffected by the variable existing at all.
services:
  pry:
    # NEVER deploy `latest` implicitly: production pins a release tag or digest,
    # e.g. PRY_IMAGE_TAG=v1.4.2 (or PRY_IMAGE_TAG=sha256:...). `latest` is only
    # the local-build convenience default; `build:` is used when the tag is
    # absent from the local image store. Set PRY_IMAGE_REPO for a registry.
    image: ${PRY_IMAGE_REPO:-pryscraper}:${PRY_IMAGE_TAG:-latest}
    build: .
    container_name: ${PRY_CONTAINER_PREFIX-}pry
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    read_only: true
    shm_size: "1g"
    tmpfs:
      # Chromium + Python scratch space. Browsers live in /ms-playwright
      # (read-only); writable state goes to /tmp and the named volumes.
      - /tmp:size=512m,mode=1777
      # uid/gid 1000 = the `pry` user (Dockerfile). Without them the tmpfs
      # is root:root 0700 and the non-root app cannot enter $HOME, which
      # crashes every asyncpg connect (SSL probe stats ~/.postgresql/...).
      - /home/pry:size=128m,mode=0700,uid=1000,gid=1000
    ports:
      - "127.0.0.1:8005:8002"
    volumes:
      - pry-data:/app/pry-data
      - pry-sessions:/app/sessions
    # Secrets live OUTSIDE the public repo tree (fleet convention, see
    # /srv/rmi-infra/.env.secrets). Contains only PRY_API_KEY, PRY_X402_*
    # and OPENROUTER_API_KEY — no fleet keys (2026-08-20 audit, P0-1/P0-2).
    # Long form with required:false so a clean install on a box WITHOUT the
    # fleet secrets file still renders (compose >= 2.24). With the file
    # present its values load normally; without it, every value must come from
    # `.env` / the shell. Self-host overrides this to `[]`.
    env_file:
      - path: /srv/rmi-infra/.env.pry
        required: false
    environment:
      # 2026-08-29 — point Pry at the Webshare secret this host ACTUALLY has.
      # Its engine already supports Webshare (src/pry/engine/webshare_proxy.py)
      # and already escalates to it on its own via needs_premium_proxy(last_error),
      # but the default gopass path is pry/webshare_proxy_list while our secret is
      # rmi/infra/webshare_proxy_list (20 rotating residential proxies). The
      # mismatch meant the premium-proxy rung never had credentials, so the ladder
      # silently stopped one rung early on every hard-blocked site.
      - PRY_WEBSHARE_GOPASS_PATH=rmi/infra/webshare_proxy_list_v2
      - PYTHONUNBUFFERED=1
      - PRY_TIMEOUT=60
      # PRY_API_KEY intentionally NOT listed here: any `environment:` entry
      # shadows the env_file value; it is supplied solely by env_file.
      # PRY_INTERNAL_TOKEN (first-party free path, x402_middleware/internal.py)
      # is supplied the SAME way — an `environment:` entry would shadow it
      # with an empty value and silently fail the internal path closed.
      - PRY_DATA_DIR=/app/pry-data
      # Persist learned per-domain tier memory across restarts. Without this
      # the method memory is process-local and every restart re-learns from zero.
      - PRY_RESILIENCE_PERSIST=1
      # PRY_ADMIN_PATH (stable admin surface prefix) comes from env_file —
      # an `environment:` entry here would shadow it with an empty value.
      # Trust the host nginx proxy (docker bridge gateway) for X-Forwarded-For
      # so per-IP rate limiting buckets real clients, not the proxy IP.
      # Without this, ALL internet traffic shares one rate-limit bucket.
      - PRY_TRUSTED_PROXIES=172.16.0.0/12,127.0.0.1,::1
      # config.json is written into the data volume so the rootfs can be
      # read-only while runtime config changes still persist.
      - PRY_CONFIG_FILE=/app/pry-data/config.json
      # Playwright browsers are at a shared read-only location; $HOME is
      # tmpfs so Chromium can write its cache there.
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      # HOME on the pry-data volume: /home/pry is a noexec tmpfs, which breaks
      # undetected_chromedriver (its driver binary must be executable) and has
      # too little space for the camoufox browser cache. The volume is
      # exec-capable and persistent.
      - HOME=/app/pry-data/home
      # /tmp is a 512m tmpfs; big downloads (camoufox ~660MB browser zip) must
      # not land there. Point TMPDIR at the volume.
      - TMPDIR=/app/pry-data/tmp
      - PYTHONDONTWRITEBYTECODE=1
      - PRY_FLARESOLVERR_URL=http://flaresolverr-pry:8191/v1
      # PRY_DATABUS_URL intentionally NOT listed here (gitleaks internal-hostname
      # rule + fleet convention: config lives in /srv/rmi-infra/.env.pry).
      # Set to the public API base + /api/v1/databus/ingest — same backend
      # process over its public route (network separation 2026-08-31; auth via
      # RMI_INTERNAL_KEY). rmi-backend binds host loopback only, so
      # host-gateway routing is not viable; public URL is the decoupled path.
      - TOR_ENABLED=1
      - TOR_SOCKS5_HOST=tor
      - TOR_SOCKS5_PORT=9050
      - PROXY_URL=
      - PROXY_TYPE=http
      - IP_ROTATION=off
      - MAX_RETRIES=3
      - MIN_QUALITY=20
      - RATE_LIMIT_RPM=120
      # Database & Redis
      # SYNC driver URL (psycopg2): db/session.get_engine() builds the sync
      # engine from this value verbatim; an asyncpg URL here crashed every
      # sync DB call with MissingGreenlet (key issuance, metering, billing).
      # Async consumers convert to +asyncpg themselves (_resolve_async_database_url).
      - PRY_DATABASE_URL=postgresql://pry:${POSTGRES_PASSWORD}@postgres:5432/pry
      - PRY_REDIS_URL=redis://redis:6379/0
      # Entrypoint runs REAL migrations: alembic upgrade head (never `stamp`).
      # The URL above is a sync psycopg2 URL; alembic/env.py also normalises an
      # async driver, which is what used to crash migrations. See docs/ops/DEPLOY.md.
      - PRY_SKIP_MIGRATIONS=0
      # Fail closed: a pre-migration backup that cannot be written aborts the
      # rollout instead of migrating an unprotected database. The scheduled
      # off-host copy is scripts/backup-postgres.sh (service `backup`).
      - PRY_REQUIRE_PRE_MIGRATION_BACKUP=1
    healthcheck:
      # HTTP /health probe — matches the Dockerfile HEALTHCHECK. A TCP probe
      # only proves the socket accepts connections and masks HTTP-level
      # failures (e.g. app crash-looping, 500s, unbound worker). /health
      # returns 200 only when the process is up and FlareSolverr is reachable.
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
        reservations:
          memory: 512M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    networks:
      - default
    # Network separation (2026-08-31 coupling audit #10): pry no longer joins
    # the shared rmi_network. The DataBus bridge reaches rmi-backend over the
    # public API route (same backend process, same RMI_INTERNAL_KEY auth);
    # retry queue + dead-letter file absorb transient unreachability.
    # NOTE: rmi-backend binds 127.0.0.1:8000 on the host, so host-gateway
    # routing is NOT an option — the public URL is the only decoupled path.
    depends_on:
      # Must be the SAME service PRY_FLARESOLVERR_URL names two lines above,
      # which is flaresolverr-pry. It was flaresolverr — the shared instance
      # degenfeed saturates — so Pry waited on the health of a service it
      # never called. Fixing one without the other is how the split happened.
      # The app needs its database and queue before the entrypoint migrates;
      # without these the first boot races Postgres and exits on connect.
      # docker-compose.selfhost.yml replaces this whole map (`!override`) with
      # flaresolverr-pry only, because it removes postgres/redis entirely.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flaresolverr-pry:
        condition: service_healthy

  # ── flaresolverr-pry: the browser tier Pry actually calls ──────────
  # THIS is Pry's FlareSolverr. Three things must name this service, and
  # all three did not agree until 53381ae6:
  #   * PRY_FLARESOLVERR_URL=http://flaresolverr-pry:8191/v1  (the call)
  #   * depends_on.flaresolverr-pry: service_healthy          (the wait)
  #   * prometheus/prometheus.yml -> http://flaresolverr-pry:8191/health
  # It is a DECLARED service, not an orphan: remove it, run
  # `docker compose up -d`, and it comes back in seconds.
  # Do NOT merge it with the shared `flaresolverr` further down — that one
  # is a separate consumer's endpoint (see its comment).
  flaresolverr-pry:
    image: ghcr.io/flaresolverr/flaresolverr:v3.3.21
    container_name: ${PRY_CONTAINER_PREFIX:-pry-}flaresolverr-pry
    restart: unless-stopped
    init: true
    # Dedicated to Pry: degenfeed saturates the shared instance (queue 40+),
    # starving the fallback ladder's browser tier.
    environment:
      - LOG_LEVEL=info
      - TZ=UTC
    mem_limit: 1500m
    cpus: 1.5
    healthcheck:
      # TCP probe: single event loop queues behind long scrape tasks.
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 8191), timeout=5); s.close()"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s
  postgres:
    image: postgres:16.4-alpine
    container_name: ${PRY_CONTAINER_PREFIX:-pry-}postgres
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pry-postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=pry
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      - POSTGRES_DB=pry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pry -d pry"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"

  redis:
    image: redis:7.4.1-alpine
    container_name: ${PRY_CONTAINER_PREFIX:-pry-}redis
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - pry-redis:/data
    # NOEVICTION IS LOAD-BEARING: this instance holds x402 nonces and quota
    # counters. `allkeys-lru` could silently evict a nonce, turning a replay
    # guard into an allow. With noeviction a full instance fails writes loudly
    # (and is alerted) instead of dropping correctness-critical keys.
    # maxmemory is below the container limit (256M) so eviction-free writes
    # fail at 192M with headroom for AOF/RDB buffers rather than OOM-killing.
    # Ephemeral LRU cache belongs on the separate `redis-cache` instance
    # (profile `cache`) or, at minimum, a different logical DB on another
    # instance — never DB 0 here.
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.1"

  # ── Ops jobs (profile `ops`, not started by `up`) ──────────────────
  # Nightly batched retention. systemd equivalent (documented in
  # scripts/retention.py): oneshot service running
  #   docker compose --profile ops run --rm retention
  # with OnCalendar=*-*-* 03:30:00 UTC, Persistent=true.
  retention:
    profiles: ["ops"]
    image: ${PRY_IMAGE_REPO:-pryscraper}:${PRY_IMAGE_TAG:-latest}
    build: .
    container_name: ${PRY_CONTAINER_PREFIX:-pry-}retention
    entrypoint: ["python", "scripts/retention.py"]
    working_dir: /app
    restart: "no"
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /home/pry:size=32m,mode=0700,uid=1000,gid=1000
    environment:
      - PRY_DATABASE_URL=postgresql://pry:${POSTGRES_PASSWORD}@postgres:5432/pry
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # On-demand off-host backup + restore test (scripts/backup-postgres.sh).
  # B2_* comes from the environment; unset B2_BUCKET means a local-only dump.
  backup:
    profiles: ["ops"]
    image: ${PRY_IMAGE_REPO:-pryscraper}:${PRY_IMAGE_TAG:-latest}
    build: .
    container_name: ${PRY_CONTAINER_PREFIX:-pry-}backup
    entrypoint: ["bash", "scripts/backup-postgres.sh"]
    working_dir: /app
    restart: "no"
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /home/pry:size=32m,mode=0700,uid=1000,gid=1000
    volumes:
      - pry-data:/app/pry-data
    environment:
      - PRY_DATABASE_URL=postgresql://pry:${POSTGRES_PASSWORD}@postgres:5432/pry
      - PRY_BACKUP_DIR=/app/pry-data/backups
      - BACKUP_RETENTION_DAYS=30
      - B2_BUCKET=${B2_BUCKET:-}
      - B2_PREFIX=${B2_PREFIX:-pry/postgres}
      - B2_ENDPOINT=${B2_ENDPOINT:-}
      - B2_KEY_ID=${B2_KEY_ID:-}
      - B2_APP_KEY=${B2_APP_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # Separate, disposable LRU cache. Never store nonces/quota here.
  redis-cache:
    profiles: ["cache"]
    image: redis:7.4.1-alpine
    container_name: ${PRY_CONTAINER_PREFIX:-pry-}redis-cache
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:6381:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.25"


  # 2026-09-27: the pry stack had NO alertmanager, so every rule in
  # prometheus/alerts.yml evaluated but could never notify anyone — the rules
  # were structurally inert exactly like the pair that used to sit in
  # fleet-infra. It runs on pryscraper_default and forwards to the fleet sink
  # (host:9099 alert-webhook), which is the SAME receiver rmi-alertmanager
  # posts to, so both Prometheus stacks converge on one notification path
  # instead of a second, competing pipeline. Verified reachable from this
  # network: pry-prometheus -> 172.28.0.1:9099 returns HTTP 200.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ${PRY_CONTAINER_PREFIX:-pry-}alertmanager
    restart: unless-stopped
    init: true
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.1"

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: ${PRY_CONTAINER_PREFIX:-pry-}prometheus
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PRY_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ${PRY_CONTAINER_PREFIX:-pry-}grafana
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PRY_GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.1"
    depends_on:
      prometheus:
        condition: service_healthy

  # ── flaresolverr: the SHARED instance — NOT Pry's ─────────────────
  # A second, independent FlareSolverr on host 127.0.0.1:8192. Pry does
  # NOT use it: PRY_FLARESOLVERR_URL, pry's depends_on, and the Prometheus
  # blackbox target all name `flaresolverr-pry` (defined above). It is kept
  # because the host port is a published interface for consumers outside
  # this repo — e.g. the fleet health probe
  # (fleet-infra/compose/gatus/gatus.yml -> http://127.0.0.1:8192/health).
  # [REVIEW] gatus is declared but not currently running on Talos, and no
  # live traffic to 8192 was observed. Keep the service until the consumer is
  # confirmed retired; do not treat "not running" as "unused".
  # Within pryscraper nothing targets it: prometheus scrapes the -pry one,
  # and docker-compose.selfhost.yml deletes this service (`!reset null`).
  # It is a DECLARED service, not an orphan: remove it, run
  # `docker compose up -d`, and it comes back in seconds.
  # DO NOT remove it on the grounds that "nothing in this repo uses it" —
  # it is consumed from outside, and the self-host overlay already treats
  # it as removable by design. Deleting it from the base file would also
  # break that overlay's explicit `!reset` entry.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.3.21
    container_name: ${PRY_CONTAINER_PREFIX:-pry-}flaresolverr
    restart: unless-stopped
    init: true
    # 8192, not 8191: flaresolverr-pry owns 8191 inside the compose
    # network and is reachable there by name. This port is the only
    # reason the shared instance is a host-level interface at all.
    ports:
      - "127.0.0.1:8192:8191"
    environment:
      - LOG_LEVEL=info
      - CAPTCHA_SOLVER=none
    healthcheck:
      # TCP-connect probe (same rationale as flaresolverr-pry): the single
      # event loop queues behind long scrape tasks, so an HTTP /health curl
      # times out under load and falsely marks the service unhealthy.
      # It no longer gates pry — pry's depends_on points at flaresolverr-pry
      # (53381ae6). This status is read by the external health probe on
      # 127.0.0.1:8192/health, not by anything in this repo.
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 8191), timeout=5); s.close()"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          # 2026-10-06: raised 512M -> 1536M. FlareSolverr v3 runs a full
          # headless Chrome; 512M OOM-killed its chromium repeatedly (kernel
          # memcg OOM at 10:51-10:54 on 2026-10-06 while a session hammered
          # 127.0.0.1:8192). The dedicated flaresolverr-pry already ran 1500m;
          # the shared instance was the odd one out. Match it.
          memory: 1536M
          cpus: "1"

  tor:
    image: dperson/torproxy:latest
    container_name: ${PRY_CONTAINER_PREFIX:-pry-}tor
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    # No healthcheck: this helper is profile-gated (`--profile tor`) and
    # nothing depends_on it, so a probe would only colour `docker compose ps`.
    # The image exposes no guaranteed probe tool (no curl/wget contract);
    # verify Tor by using it: `curl --socks5 localhost:9050 https://check.torproject.org`.
    profiles:
      - tor

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ${PRY_CONTAINER_PREFIX:-pry-}postgres-exporter
    restart: unless-stopped
    init: true
    environment:
      - DATA_SOURCE_NAME=postgresql://pry:${POSTGRES_PASSWORD}@postgres:5432/pry?sslmode=disable
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      # postgres_exporter serves /metrics on 9187; the image is alpine-based
      # (busybox wget), so no extra tooling is required.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: ${PRY_CONTAINER_PREFIX:-pry-}redis-exporter
    restart: unless-stopped
    init: true
    environment:
      - REDIS_ADDR=redis:6379
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9121/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: ${PRY_CONTAINER_PREFIX:-pry-}blackbox-exporter
    restart: unless-stopped
    init: true
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9115/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"

  # ── OpenTelemetry Collector + Jaeger ────────────────────────────────────
  # Pry's tracing (src/pry/core/observability.py) exports OTLP over HTTP when
  # OTEL_EXPORTER_OTLP_ENDPOINT is set, otherwise it falls back to console.
  # Pointing that env var at this collector (http://otel-collector:4318)
  # routes traces to both the collector console and Jaeger for local/dev
  # inspection. Enable by setting OTEL_EXPORTER_OTLP_ENDPOINT in the pry
  # service environment (see .env.example) and starting the stack.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: ${PRY_CONTAINER_PREFIX:-pry-}otel-collector
    restart: unless-stopped
    init: true
    command:
      - '--config=/etc/otelcol-contrib/config.yaml'
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"  # OTLP gRPC
      - "127.0.0.1:4318:4318"  # OTLP HTTP
    # No healthcheck: the collector image is scratch-based (no shell, no
    # wget/curl) and otel/otel-collector-config.yaml does not enable the
    # health_check extension. Configure that extension before adding a probe.
    depends_on:
      jaeger:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: ${PRY_CONTAINER_PREFIX:-pry-}jaeger
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:16686:16686"  # Jaeger UI
      - "127.0.0.1:14250:14250"  # OTLP gRPC (collector -> jaeger)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      # Jaeger all-in-one serves its UI/API on 16686; the image is alpine-based
      # (busybox wget). [REVIEW] verify `docker compose ps` shows healthy after
      # the first pull — if the base ever moves to distroless, drop this probe.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:16686/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"

volumes:
  pry-data:
  pry-sessions:
  pry-redis:
  pry-postgres:
  prometheus-data:
  grafana-data:

# No external networks — pry is fully self-contained (own pg/redis).
# DataBus bridge → rmi-backend goes over the public API URL (see pry env).
