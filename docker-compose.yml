#
# Production-hardened compose file:
#   * pry runs as non-root (Dockerfile `pry` user), read-only rootfs with
#     tmpfs scratch + named volumes for persistence
#   * healthcheck, resource limits, restart policy, init (zombie reaping),
#     no-new-privileges, and a graceful-shutdown stop grace period
#   * Postgres + Redis for production persistence
#   * Prometheus + Grafana for observability
#   * FlareSolverr and Tor are helper services (Tor behind the `tor` profile)
services:
  pry:
    build: .
    container_name: pry
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    read_only: true
    tmpfs:
      # Chromium + Python scratch space. Browsers live in /ms-playwright
      # (read-only); writable state goes to /tmp and the named volumes.
      - /tmp:size=512m,mode=1777
      # uid/gid 1000 = the `pry` user (Dockerfile). Without them the tmpfs
      # is root:root 0700 and the non-root app cannot enter $HOME, which
      # crashes every asyncpg connect (SSL probe stats ~/.postgresql/...).
      - /home/pry:size=128m,mode=0700,uid=1000,gid=1000
    ports:
      - "127.0.0.1:8005:8002"
    volumes:
      - pry-data:/app/pry-data
      - pry-sessions:/app/sessions
    # Secrets live OUTSIDE the public repo tree (fleet convention, see
    # /srv/rmi-infra/.env.secrets). Contains only PRY_API_KEY, PRY_X402_*
    # and OPENROUTER_API_KEY — no fleet keys (2026-08-20 audit, P0-1/P0-2).
    env_file: /srv/rmi-infra/.env.pry
    environment:
      - PYTHONUNBUFFERED=1
      - PRY_TIMEOUT=60
      # PRY_API_KEY intentionally NOT listed here: any `environment:` entry
      # shadows the env_file value; it is supplied solely by env_file.
      - PRY_DATA_DIR=/app/pry-data
      # config.json is written into the data volume so the rootfs can be
      # read-only while runtime config changes still persist.
      - PRY_CONFIG_FILE=/app/pry-data/config.json
      # Playwright browsers are at a shared read-only location; $HOME is
      # tmpfs so Chromium can write its cache there.
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - PYTHONDONTWRITEBYTECODE=1
      - PRY_FLARESOLVERR_URL=http://flaresolverr-pry:8191/v1
      - TOR_ENABLED=0
      - TOR_SOCKS5_HOST=tor
      - TOR_SOCKS5_PORT=9050
      - PROXY_URL=
      - PROXY_TYPE=http
      - IP_ROTATION=off
      - MAX_RETRIES=3
      - MIN_QUALITY=20
      - RATE_LIMIT_RPM=120
      # Database & Redis
      - PRY_DATABASE_URL=postgresql+asyncpg://pry:pry@postgres:5432/pry
      - PRY_REDIS_URL=redis://redis:6379/0
      # alembic/env.py connects synchronously and crashes on the asyncpg URL
      # (MissingGreenlet), so entrypoint migrations are disabled. Schema was
      # stamped at head (0003) on 2026-08-21 via a sync psycopg2 URL from the
      # host. Remove this once env.py supports async URLs. See audit P0-1.
      - PRY_SKIP_MIGRATIONS=1
    healthcheck:
      # TCP-connect probe: FlareSolverr's single event loop queues behind
      # long scrape tasks, so HTTP health checks time out under load even
      # though the service is alive and accepting connections.
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 8002), timeout=5); s.close()"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
        reservations:
          memory: 512M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      # Reach rmi-backend by name for the DataBus bridge (RAG intel feed).
      # rmi_network is created by the rmi-infra stack — external reference.
      - rmi
    depends_on:
      flaresolverr:
        condition: service_healthy
    
  flaresolverr-pry:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: pry-flaresolverr-pry
    restart: unless-stopped
    init: true
    # Dedicated to Pry: degenfeed saturates the shared instance (queue 40+),
    # starving the fallback ladder's browser tier.
    environment:
      - LOG_LEVEL=info
      - TZ=UTC
    mem_limit: 1500m
    cpus: 1.5
    healthcheck:
      # TCP probe: single event loop queues behind long scrape tasks.
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 8191), timeout=5); s.close()"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s
  postgres:
    image: postgres:16-alpine
    container_name: pry-postgres
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pry-postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=pry
      - POSTGRES_PASSWORD=pry
      - POSTGRES_DB=pry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pry -d pry"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"

  redis:
    image: redis:7-alpine
    container_name: pry-redis
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - pry-redis:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.1"

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: pry-prometheus
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PRY_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: pry-grafana
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PRY_GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.1"
    depends_on:
      prometheus:
        condition: service_healthy

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: pry-flaresolverr
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8192:8191"
    environment:
      - LOG_LEVEL=info
      - CAPTCHA_SOLVER=none
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  tor:
    image: dperson/torproxy:latest
    container_name: pry-tor
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:9050:9050"
      - "127.0.0.1:9051:9051"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    profiles:
      - tor

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: pry-postgres-exporter
    restart: unless-stopped
    init: true
    environment:
      - DATA_SOURCE_NAME=postgresql://pry:pry@postgres:5432/pry?sslmode=disable
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: pry-redis-exporter
    restart: unless-stopped
    init: true
    environment:
      - REDIS_ADDR=redis:6379
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
    depends_on:
      redis:
        condition: service_healthy

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: pry-blackbox-exporter
    restart: unless-stopped
    init: true
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"

volumes:
  pry-data:
  pry-sessions:
  pry-redis:
  pry-postgres:
  prometheus-data:
  grafana-data:

networks:
  rmi:
    external: true
    name: rmi_network
