# Smithery configuration for Pry MCP server
# https://smithery.ai/docs/config
#
# Registry identity: io.rugmunch/pry — matches server.json, glama.json,
# pulsemcp.json, SKILL.md and llms.txt. Tool count: 71 (see pry_mcp/tools.py
# PRY_TOOLS). Smithery fetches the live tool list from tools/list at deploy
# time; keep this file's comment count in sync with PRY_TOOLS on every release.

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration for your MCP server
    type: object
    required:
      - pryApiUrl
    properties:
      pryApiUrl:
        type: string
        default: https://pry.dev
        description: Base URL of the Pry backend API
      pryApiKey:
        type: string
        description: Optional API key for private Pry instances
  commandFunction: |
    (config) => ({
      command: 'python3',
      args: ['-m', 'mcp_production'],
      env: {
        PRY_API_URL: config.pryApiUrl,
        PRY_API_KEY: config.pryApiKey || ''
      }
    })

buildCommand:
  type: script
  script: |
    pip install -e ".[dev]"

# The Pry MCP server exposes 71 tools across web scraping, browser
# automation, and the fifteen data-domain packages (crypto, marketplace,
# legal, real estate, jobs, travel, attention, local, gov, ip, sports,
# climate/research, events/freight/energy/food/supply, the app-store /
# news / compliance / deals domains, and the bidding/grants domain). All
# data-domain tools are x402 pay-per-call monetized; see /v1/x402/pricing
# for the price table.

examples:
  - name: research_company
    description: Research a company website
    arguments:
      company_name: Anthropic
      website: https://anthropic.com

  - name: compare_products
    description: Compare products across e-commerce sites
    arguments:
      product_query: wireless headphones
      sites:
        - amazon
        - walmart
        - target

  - name: extract_contacts
    description: Extract contacts from a website
    arguments:
      url: https://example.com
      max_pages: 20

  - name: monitor_competitor
    description: Monitor a competitor's pricing page for changes
    arguments:
      url: https://competitor.example.com/pricing
      what_to_track: price changes
      webhook_url: ${PRY_SLACK_WEBHOOK_URL}  # set to a real Slack incoming-webhook URL

  - name: token_security
    description: Scan a crypto token for rug-pull risk signals
    arguments:
      chain: solana
      address: So11111111111111111111111111111111111111112

  - name: legal_sanctions
    description: Screen a counterparty name against the OFAC SDN list
    arguments:
      name: Vladimir Potanin

  - name: realestate_search
    description: Find real-estate listings in a city
    arguments:
      location: Austin, TX
      status: for_sale
      limit: 10

  - name: jobs_salary
    description: Benchmark software engineer salaries at a company
    arguments:
      company: google
      role: software_engineer

  - name: flights_grid
    description: Find the cheapest day to fly between two cities
    arguments:
      origin: JFK
      dest: CDG
      start_date: "2026-09-01"
      end_date: "2026-09-30"

  - name: serp
    description: Track Google SERP rankings for a keyword
    arguments:
      q: best wireless keyboard
      num: 10
